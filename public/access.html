<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f9">
  <link rel="icon" type="image/png" href="penecho-favicon.png">
  <title>PenEcho</title>
  <link rel="stylesheet" href="access.css">
</head>
<body data-theme="studio" data-studio-palette="teal">
  <div class="access-language" role="group" data-copy-aria="language" aria-label="Language">
    <button type="button" data-language="en" aria-pressed="true">EN</button>
    <button type="button" data-language="zh" aria-pressed="false">中</button>
  </div>

  <main class="access-shell">
    <section class="access-panel" aria-live="polite" aria-labelledby="accessTitle" aria-describedby="accessDescription">
      <svg class="access-mark" viewBox="0 0 96 96" aria-hidden="true"><defs><mask id="accessMarkCut"><rect width="96" height="96" fill="#fff"/><path class="access-mark-cut" pathLength="1" d="M53.6 62L53.7 59.3L53.4 56.7L52.8 54.3L51.8 52L50.6 49.9L49.1 48.1L47.3 46.6L45.5 45.4L43.5 44.5L41.5 44L39.4 43.7L37.4 43.8L35.5 44.1L33.7 44.7L32.1 45.5L30.6 46.6L29.4 47.8L28.4 49.2L27.6 50.6L27 52.1L26.7 53.7L26.6 55.2L26.8 56.7L27.1 58.1L27.7 59.4L28.4 60.5L29.2 61.6L30.2 62.4L31.3 63.1L32.4 63.6L33.5 64L34.7 64.1L35.8 64.1L36.9 63.9L37.9 63.6L38.9 63.1L39.7 62.5L40.4 61.8L41 61L41.5 60.2L41.8 59.4L42 58.5L42 57.6L41.9 56.8L41.7 56L41.4 55.2L41 54.6L40.5 54L40 53.5L39.4 53.1L38.7 52.8L38.1 52.6L37.4 52.5L36.8 52.5L36.2 52.6L35.6 52.8L35.1 53.1L34.6 53.4L34.2 53.8L33.8 54.3L33.6 54.7L33.4 55.2L33.3 55.7L33.3 56.2L33.3 56.7L33.4 57.1L33.6 57.6L33.8 57.9L34.1 58.3L34.4 58.5L34.7 58.8L35.1 58.9L35.5 59.1L35.8 59.1L36.2 59.1L36.6 59L36.9 58.9L37.2 58.8L37.5 58.6L37.7 58.4M44.8 45.1L47.3 43.3L49.7 41.4L51.9 39.3L53.9 37.1L55.8 34.7L57.4 32.2L58.9 29.5L60.2 26.7L61.3 23.7L62.3 20.6M36.4 43.9L37.4 41.3L38.1 38.7L38.6 36L39 33.4L39.1 30.7L39 28L38.7 25.2L38.1 22.5L37.4 19.8L36.5 17M29.8 47.4L29.1 45L28.3 42.7L27.3 40.5L26.1 38.4L24.8 36.4L23.3 34.5L21.7 32.7L19.9 30.9L17.9 29.3L15.8 27.8M26.7 53.4L25 52L23.2 50.8L21.3 49.7L19.4 48.7L17.4 48L15.3 47.3L13.2 46.9L11 46.5L8.7 46.4L6.4 46.4M27.6 59.3L25.7 59.2L23.7 59.2L21.8 59.4L19.9 59.8L18 60.2L16.2 60.8L14.4 61.6L12.6 62.5L10.9 63.6L9.2 64.8M31.4 63.2L29.9 64.1L28.5 65.2L27.2 66.3L26 67.5L24.9 68.8L23.8 70.2L22.9 71.7L22.1 73.3L21.4 75L20.8 76.8M36.1 64L35.5 65.5L35 67L34.7 68.5L34.4 70L34.3 71.6L34.3 73.1L34.4 74.7L34.6 76.2L35 77.8L35.5 79.4" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"/></mask></defs><path class="access-mark-shell" d="M53.6 62L53.4 63.1L53.2 64.2L52.9 65.3L52.5 66.4L52 67.5L51.5 68.5L51 69.5L50.3 70.5L49.6 71.5L48.8 72.4L48 73.3L47 74.2L46.1 75L45 75.8L44 76.5L42.8 77.1L41.6 77.7L40.4 78.2L3       <div class="access-heading">
        <h1 id="accessTitle" data-copy="checkingTitle">Opening PenEcho</h1>
        <p id="accessDescription" data-copy="checkingBody"></p>
      </div>

      <div id="accessLoading" class="access-loading" role="status">
        <span aria-hidden="true"></span><b data-copy="checking">One moment…</b>
      </div>

      <section id="accessSetup" class="access-view" hidden>
        <div class="access-choice-list">
          <button id="accessChoosePin" class="access-choice access-choice-primary" type="button">
            <span class="access-choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10M12 14v2"/></svg></span>
            <span><strong data-copy="setCode">Set a 6-digit code</strong><small data-copy="setCodeHelp">Other devices type it once.</small></span>
            <svg class="access-choice-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <button id="accessChooseOpen" class="access-choice" type="button">
            <span class="access-choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 10V7.5a3.5 3.5 0 0 1 6.700-1.400"/><rect x="5" y="10" width="14" height="10" rx="2.5"/></svg></span>
            <span><strong data-copy="continueOpen">No code</strong><small data-copy="continueOpenHelp">Anyone on this network can open PenEcho.</small></span>
            <svg class="access-choice-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
      </section>

      <section id="accessPin" class="access-view access-pin" hidden>
        <div id="accessPinDots" class="access-code" role="img" data-copy-aria="unlockStep" aria-label="6-digit code">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <p id="accessPinStep" class="access-pin-step"></p>
        <div id="accessKeypad" class="access-keypad" aria-label="Numeric keypad">
          <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
          <button type="button" data-action="clear" class="access-key-action" data-copy-aria="clear" data-copy-title="clear" aria-label="Clear" title="Clear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
          <button type="button" data-digit="0">0</button>
          <button type="button" data-action="backspace" class="access-key-action" aria-label="Backspace" title="Backspace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h10a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9L3.5 12 9 6.5Z"/><path d="m11 9.5 5 5m0-5-5 5"/></svg></button>
        </div>
        <button id="accessPinBack" class="access-text-button" type="button" data-copy="back" hidden>Back</button>
        <p class="access-restart-note"><b data-copy="forgotCode">No code at hand?</b> <span data-copy="restartHelp">Scan the QR code shown beside it.</span></p>
      </section>

      <section id="accessRisk" class="access-view" hidden>
        <button id="accessConfirmOpen" class="access-primary" type="button" data-copy="confirmOpen">Open without a code</button>
        <button id="accessRiskBack" class="access-text-button" type="button" data-copy="back">Back</button>
      </section>

      <div id="accessError" class="access-error" role="alert" hidden></div>
      <button id="accessRetry" class="access-primary" type="button" data-copy="retry" hidden>Retry</button>
    </section>
  </main>
  <script src="access.js"></script>
</body>
</html>
