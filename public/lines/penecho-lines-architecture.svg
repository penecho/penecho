<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="50 0 1120 810" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif' role="img" aria-label="PenEcho architecture: PenEcho sends direct jobs to agents, or orchestrator jobs that the Orchestrator splits into parts; agents read and write the project folder and read and update the Project Doc (MEMORY.md, lines, works), which PenEcho also reads and writes">
<title>PenEcho architecture</title>
<rect x="50" y="0" width="1120" height="810" rx="24" fill="#ffffff"/>
    <defs>
      <marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
      </marker>
      <marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
      </marker>
      <marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
      </marker>
      <marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
      </marker>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
      </filter>
    </defs>

    <!-- ===== PenEcho ===== -->
    <rect x="80" y="20" width="560" height="104" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="360" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">PenEcho</text>
    <text x="360" y="96" text-anchor="middle" font-size="14" fill="#64748b">Canvas · Lines · Asks</text>

    <!-- ===== Direct job (left lane) ===== -->
    <line x1="200" y1="124" x2="200" y2="398" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
    <rect x="132" y="236" width="136" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="200" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Direct job</text>

    <!-- ===== Orchestrator job (right lane) ===== -->
    <line x1="490" y1="124" x2="490" y2="198" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-violet)"/>
    <rect x="404" y="144" width="172" height="34" rx="17" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="490" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#6d28d9">Orchestrator job</text>

    <rect x="360" y="202" width="260" height="96" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <text x="490" y="242" text-anchor="middle" font-size="22" font-weight="700" fill="#6d28d9">Orchestrator</text>
    <text x="490" y="270" text-anchor="middle" font-size="14" fill="#64748b">plans · splits · picks agents</text>

    <!-- parts fan out -->
    <path d="M430,298 L430,398" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-violet)"/>
    <path d="M490,298 L490,398" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-violet)"/>
    <path d="M550,298 L550,398" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-violet)"/>
    <rect x="452" y="332" width="76" height="28" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="490" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">parts</text>

    <!-- ===== Agents ===== -->
    <rect x="80" y="402" width="560" height="150" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="360" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Agents</text>
    <g>
      <rect x="112" y="474" width="112" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="168" y="502" text-anchor="middle" font-size="15" font-weight="600" fill="#c2410c">Claude</text>
      <rect x="240" y="474" width="112" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="296" y="502" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Codex</text>
      <rect x="368" y="474" width="112" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="424" y="502" text-anchor="middle" font-size="15" font-weight="600" fill="#0369a1">Kimi</text>
      <rect x="496" y="474" width="112" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="552" y="502" text-anchor="middle" font-size="15" font-weight="600" fill="#64748b">…</text>
    </g>

    <!-- ===== Agents -> Project folder ===== -->
    <line x1="360" y1="552" x2="360" y2="626" stroke="#475569" stroke-width="2.5" marker-start="url(#a-slate)" marker-end="url(#a-slate)"/>
    <rect x="290" y="574" width="140" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="360" y="595" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">read / write</text>

    <!-- ===== Project folder ===== -->
    <path d="M80,670 a18,18 0 0 1 18,-18 h160 l22,-20 h100 l22,20 h220 a18,18 0 0 1 18,18 v96 a18,18 0 0 1 -18,18 h-524 a18,18 0 0 1 -18,-18 z" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="360" y="716" text-anchor="middle" font-size="22" font-weight="700" fill="#b45309">Project folder</text>
    <text x="360" y="744" text-anchor="middle" font-size="14" fill="#64748b">code · files</text>

    <!-- ===== Project Doc (right column) ===== -->
    <g filter="url(#shadow)">
      <rect x="800" y="20" width="340" height="532" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    </g>
    <text x="970" y="74" text-anchor="middle" font-size="22" font-weight="700" fill="#0f766e">Project Doc</text>
    <g>
      <rect x="828" y="110" width="284" height="80" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
      <text x="970" y="157" text-anchor="middle" font-size="17" font-weight="600" font-family='"SF Mono", Menlo, Consolas, monospace' fill="#0f766e">MEMORY.md</text>
      <rect x="828" y="210" width="284" height="80" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
      <text x="970" y="257" text-anchor="middle" font-size="17" font-weight="600" font-family='"SF Mono", Menlo, Consolas, monospace' fill="#0f766e">lines/*.md</text>
      <rect x="828" y="310" width="284" height="80" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
      <text x="970" y="357" text-anchor="middle" font-size="17" font-weight="600" font-family='"SF Mono", Menlo, Consolas, monospace' fill="#0f766e">works/*.md</text>
      <rect x="828" y="410" width="284" height="80" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="970" y="457" text-anchor="middle" font-size="17" font-weight="600" font-family='"SF Mono", Menlo, Consolas, monospace' fill="#64748b">files/ …</text>
    </g>

    <!-- PenEcho <-> Project Doc -->
    <line x1="644" y1="72" x2="796" y2="72" stroke="#0d9488" stroke-width="2.5" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
    <rect x="660" y="38" width="120" height="28" rx="14" fill="#ffffff" stroke="#ccfbf1" stroke-width="1.5"/>
    <text x="720" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">Asks · results</text>

    <!-- Agents <-> Project Doc -->
    <line x1="644" y1="477" x2="796" y2="477" stroke="#0d9488" stroke-width="2.5" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
    <rect x="660" y="443" width="120" height="28" rx="14" fill="#ffffff" stroke="#ccfbf1" stroke-width="1.5"/>
    <text x="720" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">read / update</text>
  </svg>
