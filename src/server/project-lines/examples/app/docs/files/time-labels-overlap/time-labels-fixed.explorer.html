<!doctype html>
<html lang="en" data-penecho-prototype>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>After the fix</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #f8fafc; color: #0f172a; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 32px 32px; }
  .top { display: flex; align-items: baseline; gap: 14px; padding: 0 0 14px; }
  .top h1 { margin: 0; font-size: 22px; }
  .top span { color: #64748b; }
  #lines { padding: 6px 0 14px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
  .hours, .line { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); align-items: center; padding: 0 28px 0 24px; }
  .hours { height: 34px; color: #94a3b8; font-size: 12px; }
  .line { height: 76px; border-top: 1px solid #f1f5f9; }
  .name b { display: block; font-size: 14.5px; }
  .name span { color: #64748b; font-size: 12.5px; }
  .track { position: relative; height: 100%; }
  .hours .track span { position: absolute; bottom: 8px; transform: translateX(-50%); }
  .rail { position: absolute; top: 26px; height: 2px; background: #cbd5e1; }
  .dot { position: absolute; top: 21px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; border: 2.5px solid #2563eb; box-sizing: border-box; }
  .dot.canvas { border-radius: 3px; background: #e9551f; border-color: #e9551f; }
  .dot.work { background: #0d9488; border-color: #0d9488; transform: rotate(45deg); border-radius: 2px; }
  .dot.done { background: #16a34a; border-color: #16a34a; }
  .time { position: absolute; top: 38px; transform: translateX(-50%); color: #475569; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .time.row-1 { top: 54px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Timeline</h1>
    <span id="project"></span>
  </header>
  <main id="lines"></main>
</div>
<script>
const PROJECT = { name:"Bakery website" };
const LINES = [
  { title:"Menu page", day:"Mon", steps:[["canvas", "09:05"], ["ask", "09:12"], ["work", "09:40", "Claude"], ["ask", "11:02"], ["work", "11:31", "Codex"], ["done", "14:10"]] },
  { title:"Opening hours", day:"Mon", steps:[["ask", "10:20"], ["work", "10:31", "Codex"], ["done", "10:45"]] },
  { title:"Order form", day:"Tue", steps:[["ask", "09:30"], ["work", "09:38", "Claude"], ["ask", "09:44"], ["work", "09:52", "Claude"], ["ask", "15:10"], ["work", "15:40", "Codex"]] },
  { title:"Photos of the cakes", day:"Wed", steps:[["canvas", "13:00"], ["ask", "13:05"], ["work", "13:20", "Claude"], ["done", "16:30"]] },
  { title:"Contact page", day:"Thu", steps:[["ask", "11:15"], ["work", "11:24", "OpenCode"]] },
];
function placeLabels(xs, width = 36, gap = 4) {
  const ends = [-Infinity, -Infinity];
  return xs.map(x => {
    const row = ends.findIndex(end => x - width / 2 >= end + gap);
    if (row >= 0) ends[row] = x + width / 2;
    return { x, row };
  });
}
const DAY_START = 8, DAY_END = 18, TRACK = 640;
const minutes = time => { const [h, m] = time.split(":").map(Number); return h * 60 + m; };
const xOf = time => Math.round((minutes(time) - DAY_START * 60) / ((DAY_END - DAY_START) * 60) * TRACK);

const pctOf = x => `${(x / TRACK * 100).toFixed(2)}%`;

function lineRow(line) {
  const row = document.createElement("section");
  row.className = "line";
  const dots = line.steps.map(([kind, time, who]) => `<i class="dot ${kind}" style="left:${pctOf(xOf(time))}" title="${who || kind} · ${time}"></i>`).join("");
  const times = placeLabels(line.steps.map(([, time]) => xOf(time))).map((label, i) => label.row < 0 ? "" : `<span class="time row-${label.row}" style="left:${pctOf(label.x)}">${line.steps[i][1]}</span>`).join("");
  const first = xOf(line.steps[0][1]), last = xOf(line.steps[line.steps.length - 1][1]);
  row.innerHTML = `<div class="name"><b>${line.title}</b><span>${line.day}</span></div>
    <div class="track"><i class="rail" style="left:${pctOf(first)};width:${pctOf(last - first)}"></i>${dots}${times}</div>`;
  return row;
}

document.getElementById("project").textContent = PROJECT.name;
const hours = [];
for (let h = DAY_START; h <= DAY_END; h += 2) hours.push(`<span style="left:${pctOf(xOf(`${h}:00`))}">${String(h).padStart(2, "0")}:00</span>`);
document.getElementById("lines").innerHTML = `<div class="hours"><div></div><div class="track">${hours.join("")}</div></div>`;
for (const line of LINES) document.getElementById("lines").append(lineRow(line));
try { window.parent?.postMessage({ type:"penecho-widget-updated" }, "*"); } catch {}
</script>
</body>
</html>
