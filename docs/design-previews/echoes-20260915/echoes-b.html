<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echoes · Visual design proposal</title>
<style>
:root {
  --bg:#f1f3f0; --paper:#fff; --subtle:#f7f8f5; --line:#dde1d8;
  --ink:#30352f; --muted:#626b60; --accent:#3b5034; --selected:#e9eddf;
  --nav:#f7f7ef; --nav-ink:#616b58; --nav-line:#d9ddcf;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif;
  color:var(--ink); background:var(--paper); font-size:13px;
}
* { box-sizing:border-box; }
body { margin:0; min-width:0; }
body[data-theme="b"] {
  --bg:#f2f0eb; --paper:#fdfcf9; --subtle:#f4f2ed; --line:#e1ded6;
  --ink:#30352f; --muted:#68665e; --accent:#3b5034; --selected:#e9eddf;
  --nav:#f7f7ef; --nav-ink:#616b58; --nav-line:#d9ddcf;
}
button,input,select,textarea { font:inherit; color:inherit; }
button,a { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; }
button { height:30px; padding:0 10px; border:1px solid var(--line); border-radius:5px; background:var(--paper); display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:500; white-space:nowrap; position:relative; }
button::after { content:""; position:absolute; inset:-3px 0; }
button:hover { background:var(--subtle); border-color:var(--muted); }
button:disabled { cursor:default; opacity:.5; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.quiet { background:transparent; border-color:transparent; }
button.selected,button[aria-pressed="true"] { color:var(--accent); background:var(--selected); border-color:transparent; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
input,select { height:30px; border:1px solid var(--line); border-radius:5px; background:var(--paper); padding:0 9px; min-width:0; }
textarea { width:100%; resize:vertical; min-height:82px; border:1px solid var(--line); background:var(--paper); border-radius:5px; padding:10px; line-height:1.6; }
input::placeholder,textarea::placeholder { color:var(--muted); opacity:1; }
input,textarea { caret-color:var(--accent); }
::selection { background:var(--selected); color:var(--accent); }
* { scrollbar-color:var(--line) transparent; scrollbar-width:thin; }
svg.icon { width:16px; height:16px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; flex:none; }
a { color:var(--accent); text-decoration:none; text-underline-offset:3px; }
a:hover { text-decoration:underline; }
h1,h2,h3,p { margin:0; }
h1 { font-size:25px; font-weight:650; letter-spacing:-.025em; line-height:1.25; }
h2 { font-size:17px; font-weight:600; letter-spacing:-.015em; }
h3 { font-size:14px; line-height:1.5; font-weight:600; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.between { justify-content:space-between; }
.fill { flex:1; min-width:0; }
.reviewbar { min-height:44px; padding:6px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--paper); border-bottom:1px solid var(--line); }
.reviewbar strong { font-size:12px; }
.reviewbar .seg { margin-left:auto; }
.review-note { font-size:11px; color:var(--muted); }
.seg { display:inline-flex; align-items:center; gap:2px; background:var(--bg); padding:2px; border-radius:6px; }
.seg button { height:24px; border:none; background:transparent; padding:0 10px; font-size:12.5px; }
.seg button.selected { background:var(--paper); color:var(--ink); box-shadow:0 1px 3px #20242c14; }
.app { display:grid; grid-template-columns:216px minmax(0,1fr); min-height:calc(100dvh - 44px); background:var(--bg); }
.sidebar { background:var(--nav); border-right:1px solid var(--nav-line); color:var(--nav-ink); padding:20px 12px 12px; display:flex; flex-direction:column; gap:16px; }
.brand { font-size:22px; color:var(--ink); padding:0 10px 12px; letter-spacing:-1px; }
body[data-theme="b"] .brand { color:#30372d; }
.brand b { font-weight:750; }
.navgroup { display:grid; gap:4px; }
.navgroup small { padding:0 10px 3px; font-size:11px; }
.navgroup button { width:100%; justify-content:flex-start; background:transparent; border-color:transparent; gap:10px; color:inherit; height:32px; font-weight:400; }
.navgroup button.selected { background:var(--selected); color:var(--accent); font-weight:600; }
body[data-theme="b"] .navgroup button.selected { background:#e9eddf; color:#3b5034; }
.sidebar-footer { margin-top:auto; padding-top:20px; display:grid; gap:6px; }
.sidebar-footer .account { padding:10px 8px 0; border-top:1px solid var(--nav-line); display:flex; align-items:center; gap:8px; }
.avatar { width:26px; height:26px; border-radius:50%; background:#e5eadf; color:#46543e; display:inline-grid; place-items:center; font-size:11px; font-weight:600; flex:none; }
.avatar.orange { background:#f3dfd1; color:#8d4e2e; }
.avatar.blue { background:#dce9f4; color:#355e84; }
.workspace { min-width:0; container-type:inline-size; }
.topline { height:46px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--paper); display:flex; align-items:center; gap:10px; }
.topline .crumb { color:var(--muted); font-size:12px; }
.topline .spacer { flex:1; }
.publicnav { display:none; }
body.public-mode .sidebar { display:none; }
body.public-mode .app { grid-template-columns:minmax(0,1fr); }
body.public-mode .publicnav { display:flex; gap:10px; align-items:center; }
.page { padding:24px; max-width:1600px; margin:auto; }
.pagehead { display:flex; align-items:center; gap:16px; justify-content:space-between; margin-bottom:20px; }
.pagehead p { margin-top:6px; line-height:1.5; color:var(--muted); }
.tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-bottom:16px; border-bottom:1px solid var(--line); }
.search { flex:1 1 240px; display:flex; align-items:center; position:relative; }
.search svg { position:absolute; left:9px; color:var(--muted); }
.search input { width:100%; padding-left:32px; }
.resultsbar { display:flex; gap:12px; align-items:center; min-height:44px; }
.resultsbar .layout { margin-left:auto; }
.kind { font-size:11px; display:inline-flex; align-items:center; gap:4px; color:#3b5034; background:#e9eddf; border-radius:4px; padding:3px 6px; }
.kind.widget { color:#955121; background:#f8eadb; }
.kind svg { width:12px; height:12px; }
.cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
.card { min-width:0; background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.card:hover { border-color:#a4a9b5; }
.thumb { width:100%; height:154px; border:0; border-radius:0; padding:0; overflow:hidden; display:grid; place-items:center; background:#fafbfe; position:relative; color:var(--muted); }
.thumb::after { inset:0; }
.thumb img { width:100%; height:100%; object-fit:cover; }
.thumb .kind { position:absolute; top:8px; left:8px; }
.thumb .fallback { display:grid; justify-items:center; gap:9px; color:var(--muted); }
.fallback svg { width:30px; height:30px; stroke-width:1.3; }
.thumb.diagram { background:#eff1fa; }
.cardbody { padding:12px; }
.cardtitle { border:0; background:none; height:auto; display:block; white-space:normal; text-align:left; padding:0; line-height:1.45; font-size:14px; font-weight:600; width:100%; min-height:40px; }
.cardtitle:hover { background:transparent; color:var(--accent); }
.desc { color:var(--muted); font-size:12px; line-height:1.55; margin-top:5px; min-height:37px; }
.tags { display:flex; gap:8px; flex-wrap:wrap; font-size:11px; line-height:1.7; margin:8px 0 10px; }
.tags button { height:auto; border:0; padding:0; font-size:11px; color:var(--muted); background:none; }
.tags button:hover { color:var(--accent); text-decoration:underline; }
.byline { display:flex; align-items:center; gap:7px; min-width:0; font-size:11px; color:var(--muted); }
.byline .author { color:var(--ink); border:0; height:auto; padding:0; background:none; display:block; font-size:11px; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.byline .copy { min-width:0; flex:1; }
.social { display:flex; align-items:center; gap:5px; border-top:1px solid var(--line); padding:7px 8px; color:var(--muted); }
.social button { border:0; background:transparent; height:28px; padding:0 5px; font-size:11px; font-weight:400; }
.social button.hearted { color:#c43b56; }
.social .echo-count { margin-right:auto; font-size:11px; padding-left:4px; white-space:nowrap; }
.list-kind { display:none; }
.cards.list .list-kind { display:inline-flex; }
.cards.list .byline { flex-wrap:wrap; }
.cards.list { display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line); }
.cards.list .card { display:grid; grid-template-columns:112px minmax(0,1fr) 144px; padding:12px 0; border:none; border-radius:0; border-bottom:1px solid var(--line); gap:16px; background:transparent; align-items:center; }
.cards.list .thumb { height:80px; border-radius:5px; }
.cards.list .thumb .kind { display:none; }
.cards.list .cardbody { padding:0; }
.cards.list .cardtitle { min-height:0; }
.cards.list .desc { min-height:0; margin:4px 0; }
.cards.list .tags { margin:3px 0 6px; }
.cards.list .social { border:none; flex-wrap:wrap; justify-content:flex-end; padding:0; }
.cards.list .echo-count { width:100%; margin:0; text-align:right; }
.cards.list .byline .copy { display:flex; gap:8px; align-items:center; }
.cards.list .byline .avatar { width:20px; height:20px; }
.feedfoot { display:flex; justify-content:center; gap:12px; padding:24px 0 10px; color:var(--muted); }
.filterbox { padding:16px; background:var(--paper); border:1px solid var(--line); border-radius:8px; margin:12px 0; }
.filterbox .row + .row { margin-top:12px; }
.filterbox label { display:flex; gap:8px; align-items:center; }
.detailhead { margin:0 0 18px; }
.detailhead h1 { max-width:800px; margin:10px 0; font-size:26px; }
.detailhead .summary { color:var(--muted); line-height:1.65; max-width:78ch; }
.detail-layout { display:grid; grid-template-columns:minmax(0,1fr) 286px; gap:24px; align-items:start; }
.detail-preview { background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.preview-tools { display:flex; justify-content:space-between; align-items:center; padding:7px 10px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
.large-preview { min-height:300px; height:360px; display:grid; place-items:center; background:#fff; overflow:hidden; }
.large-preview img { width:100%; height:100%; object-fit:contain; }
.large-preview .fallback { display:grid; justify-items:center; gap:12px; color:var(--muted); }
.caption { padding:12px; border-top:1px solid var(--line); font-size:12px; line-height:1.6; }
.caption b { display:block; font-weight:500; }
.detail-side { padding:0; }
.creator { display:flex; gap:10px; align-items:center; }
.creator .avatar { width:36px; height:36px; font-size:14px; }
.creator p { color:var(--muted); font-size:12px; margin-top:4px; }
.detail-side .actions { display:grid; gap:8px; margin-top:20px; }
.detail-side .actions > button { width:100%; }
.detail-side .actions .row button { flex:1; }
.explanation { font-size:12px; color:var(--muted); line-height:1.65; margin-top:10px; }
.numbers { display:flex; justify-content:space-between; gap:10px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:20px 0 12px; }
.numbers b { font-size:18px; font-weight:600; display:block; margin-bottom:3px; }
.numbers span { color:var(--muted); font-size:11px; }
.collaborators { padding:12px 0; display:grid; gap:10px; }
.section { margin-top:24px; padding-top:20px; border-top:1px solid var(--line); }
.section .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.lineage { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; }
.step { display:block; border:0; background:transparent; border-radius:0; padding:0 12px 0 0; white-space:normal; text-align:left; height:auto; position:relative; }
.step .step-track { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.step .step-track::after { content:""; height:1px; background:var(--line); flex:1; }
.step .dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--bg); color:var(--muted); font-size:11px; }
.step.active .dot { background:var(--accent); color:#fff; }
.step h3 { font-size:12px; font-weight:500; }
.step p { color:var(--muted); font-size:11px; line-height:1.6; margin-top:5px; }
.branch-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.next { margin-top:20px; background:var(--selected); padding:14px 16px; border-radius:8px; color:var(--accent); }
.next p { line-height:1.65; font-size:12px; margin-top:4px; }
.comments { max-width:900px; }
.comment { display:flex; gap:10px; margin:16px 0; font-size:12px; line-height:1.65; }
.comment time { margin-left:10px; font-size:11px; color:var(--muted); }
.composer { margin-top:16px; }
.composer .row { margin-top:8px; }
.comment-image { max-width:180px; max-height:100px; border-radius:5px; display:block; margin-top:8px; }
body[data-theme="b"] h1 { font-family:Georgia,"Songti SC",serif; font-weight:500; font-size:30px; }
body[data-theme="b"] .page { background:var(--paper); min-height:calc(100dvh - 90px); }
body[data-theme="b"] .detail-layout { grid-template-columns:300px minmax(0,1fr); }
body[data-theme="b"] .detail-side { grid-column:1; grid-row:1; }
body[data-theme="b"] .detail-work { grid-column:2; grid-row:1; }
.state { padding:64px 20px; text-align:center; color:var(--muted); grid-column:1/-1; }
.state h2 { color:var(--ink); margin-bottom:8px; }
.state button { margin-top:16px; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); max-width:calc(100% - 32px); padding:10px 16px; border-radius:8px; background:#252932; color:white; box-shadow:0 6px 14px #11182724; z-index:20; font-size:12px; }
dialog { width:min(480px,calc(100% - 32px)); border:0; border-radius:14px; padding:24px; background:var(--paper); color:var(--ink); box-shadow:0 14px 30px #11182733; }
dialog::backdrop { background:#00000038; }
dialog .dialog-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:16px; }
dialog p { line-height:1.65; margin:12px 0; color:var(--muted); }
dialog input { width:100%; margin-bottom:14px; }
dialog.preview-dialog { width:min(1080px,calc(100% - 32px)); }
dialog.preview-dialog img { width:100%; max-height:75dvh; object-fit:contain; }
[hidden] { display:none!important; }
@container (max-width: 960px) {
  .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .detail-layout,body[data-theme="b"] .detail-layout { grid-template-columns:minmax(0,1fr) 260px; gap:16px; }
  body[data-theme="b"] .detail-layout { grid-template-columns:260px minmax(0,1fr); }
}
@container (max-width: 720px) {
  .page { padding:20px; }
  .detail-layout,body[data-theme="b"] .detail-layout { display:flex; flex-direction:column; }
  .detail-side,.detail-work { width:100%; }
  .detail-side { display:contents; }
  .detail-side > * { width:100%; }
  .detail-side .creator { order:1; }
  .detail-side .actions { order:2; margin-top:0; }
  .detail-side .explanation { order:3; margin-top:0; }
  .detail-work { order:4; }
  .detail-side .numbers { order:5; }
  .detail-side .social { order:6; }
  .detail-side .collaborators { order:7; }
  .detail-side .explanation:last-child { order:8; }
  .detail-side .actions { grid-template-columns:1fr 1fr; }
  .detail-side .actions .row { grid-column:1/-1; }
  .detail-side .numbers { margin-top:12px; }
  .large-preview { height:300px; }
  .cards.list .card { grid-template-columns:96px minmax(0,1fr); gap:12px; }
  .cards.list .social { grid-column:2; justify-content:flex-start; }
  .cards.list .echo-count { width:auto; margin-right:auto; }
  .cards.list .thumb { height:64px; align-self:start; }
}
@media (max-width:760px) {
  .app { grid-template-columns:64px minmax(0,1fr); }
  .sidebar { padding:18px 8px; }
  .brand { font-size:19px; padding:0 2px 8px; }
  .brand span,.navgroup small,.navgroup button span,.sidebar-footer .account .copy,.sidebar-footer button span { display:none; }
  .brand b::after { content:""; }
  .navgroup button { justify-content:center; padding:0; }
  .sidebar-footer button { font-size:0; }
  .sidebar-footer .account { padding:10px 0 0; justify-content:center; }
  .topline { padding:0 16px; }
  .review-note { display:none; }
}
@media (max-width:520px) {
  .app { grid-template-columns:minmax(0,1fr); }
  .sidebar { display:none; }
  .reviewbar { padding:8px 12px; }
  .reviewbar strong { flex-basis:100%; }
  .reviewbar .seg { margin:0; }
  .page { padding:16px; }
  .pagehead { align-items:flex-start; }
  .pagehead p { max-width:24ch; }
  .cards { grid-template-columns:1fr; }
  .tools select { flex:1; }
  .lineage { grid-template-columns:1fr; gap:16px; }
  .topline .crumb { display:none; }
  .publicnav button:not(:first-child) { display:none; }
  h1,body[data-theme="b"] h1 { font-size:24px; }
}
@media (prefers-reduced-motion:no-preference) { button { transition:background-color .12s ease-out,border-color .12s ease-out; } }
@media (pointer:coarse) { button::after { inset:-7px 0; } .row,.tools { gap:14px 8px; } }
@media (forced-colors:active) { .kind,.avatar,.dot { border:1px solid CanvasText; } button.selected { outline:2px solid Highlight; } }
</style>
</head>

<div class="reviewbar">
  <strong id="proposal-name"></strong><span class="review-note">Interactive prototype · sample content</span>
  <div class="seg" aria-label="Preview page"><button data-page="list" class="selected">Browse</button><button data-page="detail">Craft detail</button></div>
  <select id="context" aria-label="Page context"><option value="dashboard">In Dashboard</option><option value="public">Standalone page</option></select>
  <select id="state" aria-label="Preview state"><option value="normal">Default state</option><option value="no-image">Missing preview</option><option value="empty">No results</option><option value="loading">Loading</option><option value="error">Load error</option><option value="legacy">Echo not enabled</option><option value="blocked">Author only</option></select>
</div>
<div class="app">
  <aside class="sidebar" aria-label="Dashboard navigation">

  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button data-close aria-label="Close">×</button></div><div id="dialog-body"></div></dialog>
<script>
const THEME = 'b';
const PATHS = {

  canvas:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/>',

  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',

  if(b.hasAttribute('data-play')){if(playing){stopPlayback();b.innerHTML=icon('play')+'Continue playback';return;}selectStep(0);b.textContent='Pause playback';playing=setInterval(()=>{if(step===2){stopPlayback();b.innerHTML=icon('play')+'Watch again';return;}selectStep(step+1);},1500);return;}
  if(b.hasAttribute('data-branch')){selected=1;page='detail';render();return;}
  if(b.hasAttribute('data-comment-submit')){const field=document.getElementById('comment');if(!field.value.trim()&&!commentImage){field.focus();return;}comments.push({text:field.value.trim(),image:commentImage});commentImage=null;field.value='';document.getElementById('paste-preview').innerHTML='';renderComments();notify();return;}
  if(b.hasAttribute('data-remove-image')){commentImage=null;document.getElementById('paste-preview').innerHTML='';return;}
  if(b.dataset.pageNav){toast('This preview has 6 Crafts. The live page keeps: '+b.dataset.pageNav+'。');return;}
  if(b.dataset.info){toast(b.dataset.info+' is retained in the live app. This is an Echoes visual preview.');}
});
document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;results();}});
document.addEventListener('change',event=>{
  const e=event.target;
  if(e.id==='sort'){sort=e.value;results();}
  if(e.id==='category'){category=e.value;results();}
  if(e.id==='state'){previewState=e.value;render();}
  if(e.id==='context'){document.body.classList.toggle('public-mode',e.value==='public');notify();}
  if(e.id==='period'){document.getElementById('period-note').textContent=e.value+' · Sample data';}
});
document.addEventListener('paste',event=>{
  if(event.target.id!=='comment')return;
  const file=Array.from(event.clipboardData?.files||[]).find(f=>f.type.startsWith('image/'));
  if(!file)return;event.preventDefault();
  const reader=new FileReader();reader.onload=()=>{commentImage=reader.result;document.getElementById('paste-preview').innerHTML='<img class="comment-image" alt="Image ready to post" src="'+commentImage+'"><button class="quiet" data-remove-image>Remove image</button>';notify();};reader.readAsDataURL(file);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPlayback();});
document.querySelectorAll('[data-icon]').forEach(e=>e.insertAdjacentHTML('afterbegin',icon(e.dataset.icon)));
render();
</script>
</body>
</html>
