<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-labelledby="title desc">
  <title id="title">Buy PenEcho a coffee</title>
  <desc id="desc">PenEcho is open source and free on your computer. If it saved you time, buy us a coffee. Every coffee goes into development, testing and docs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="818" height="198" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/>
  <!-- a cup, with a line of work rising from it -->
  <g transform="translate(44 52)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 34h64v30a26 26 0 0 1-26 26H32A26 26 0 0 1 6 64z" fill="#ffdd00" stroke="#0f172a" stroke-width="4"/>
    <path d="M70 42h8a13 13 0 0 1 0 26h-9" stroke="#0f172a" stroke-width="4"/>
    <path d="M24 22c0-8 8-8 8-16M44 22c0-8 8-8 8-16" stroke="#94a3b8" stroke-width="4"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="160" y="56" fill="#2563eb" font-size="13" font-weight="700" letter-spacing="2">OPEN SOURCE · FREE ON YOUR COMPUTER</text>
    <text x="160" y="98" fill="#0f172a" font-size="30" font-weight="700">If PenEcho saved you time, buy us a coffee.</text>
    <text x="160" y="130" fill="#475569" font-size="17">Every coffee goes into development, testing and docs.</text>
    <rect x="160" y="148" width="212" height="34" rx="17" fill="#ffdd00"/>
    <text x="266" y="171" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Buy us a coffee  →</text>
    <text x="390" y="171" fill="#64748b" font-size="14">buymeacoffee.com/penecho</text>
  </g>
</svg>
