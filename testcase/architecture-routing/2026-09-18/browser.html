<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>架构路由修复 · Widget 沙箱验收</title>
<style>body{margin:0;color:#243246;background:#f4f6f9;font:14px system-ui}header{padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{font:inherit;padding:6px 10px}main{overflow:auto;padding:12px}iframe{border:0;display:block;background:white;height:4000px;width:1450px}#status{font-size:12px}</style>
<header><span>同一份原始 JSON · 正式 Widget Host</span><button data-width="3200">宽幅 3200</button><button data-width="1450">常规 1450</button><button data-width="1248">原图宽度 1248</button><button data-width="390">窄幅 390</button><span id="status">加载中</span></header>
<main><iframe id="host" src="/public/widget-host.html" title="真实 Widget 沙箱"></iframe></main>
<script>
const host=document.querySelector('#host'),status=document.querySelector('#status');let loaded=false;
addEventListener('message',async event=>{
 if(event.source!==host.contentWindow)return;
 if(event.data.type==='penecho-widget-host-ready'&&!loaded){
  loaded=true;const data=await(await fetch('/input.json')).json();
  const html='<section data-penecho-architecture><script type="application/json" data-architecture-source>'+JSON.stringify(data).replace(/</g,'\\u003c')+'<'+ '/script></section>';
  host.contentWindow.postMessage({type:'penecho-widget-init',title:data.title,sourceFormat:'penecho-mcp+html',html},location.origin);
  host.contentWindow.postMessage({type:'penecho-widget-state',selected:true,active:true,interactive:true,scaleX:1,scaleY:1},location.origin);
 }
 if(event.data.type==='penecho-widget-capture-ready')status.textContent='布局完成';
 if(event.data.type==='penecho-widget-runtime-diagnostics'&&event.data.errors.length)status.textContent=JSON.stringify(event.data.errors);
});
document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{host.style.width=button.dataset.width+'px';status.textContent='容器宽度 '+button.dataset.width+' px';});
</script></html>
