<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>架构图 · 宽度自适应验收</title>
<style>body{margin:0;background:#f4f6f9;font:14px Arial,sans-serif;color:#172638}header{padding:16px 24px;background:white;border-bottom:1px solid #dbe3ed;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}button,select{font:inherit;padding:8px 12px;background:white;border:1px solid #cbd5e3;border-radius:5px}main{padding:20px;overflow:auto}iframe{display:block;width:1600px;height:2200px;border:0;background:white}#status{font-size:12px;color:#526277}</style>
<header><h1>同一份 JSON，随容器宽度重新布局</h1><select id="fixture" aria-label="测试数据"><option value="mcp.semantic.json">MCP 基准</option><option value="glm-json-reviewed/response.json">模型生成的 MCP</option><option value="uk-power-regression.json">跨组调用回归</option></select><button data-width="2200">宽幅 2200</button><button data-width="1600">常规 1600</button><button data-width="1000">窄幅 1000</button><button data-width="640">紧凑 640</button><button id="zoom">画布缩放模拟</button><button id="height">仅改高度</button><button id="capture">改窄并立即截图</button><span id="status">正在加载…</span></header>
<main><iframe id="host" src="/public/widget-host.html" title="真实 Widget 沙箱"></iframe></main>
<script>
const host=document.querySelector('#host'),status=document.querySelector('#status'),select=document.querySelector('select');let loaded=false;
const query=new URLSearchParams(location.search);host.style.width=(query.get('width')||1600)+'px';
if(query.get('fixture'))select.value=query.get('fixture');
async function show(){const data=await(await fetch('/testcase/archify-local/2026-09-18/'+select.value)).json();const plain=query.get('plain')==='1';const graph='<section data-penecho-architecture><script type="application/json" data-architecture-source>'+JSON.stringify(data).replace(/</g,'\\u003c')+'<'+ '/script></section>';
const html='<!doctype html><body style="margin:8px;font:14px Arial"><p>普通 HTML 说明：缩放画布不重排；修改 Widget 的实际宽度才重排。</p>'+(plain?'<h1>普通 HTML，无架构运行时</h1>':graph)+'<footer style="padding:16px">详情、颜色、分组与关系保留；模型无需输出坐标。</footer>';
host.contentWindow.postMessage({type:'penecho-widget-init',title:data.title,sourceFormat:'penecho-mcp+html',html},location.origin);host.contentWindow.postMessage({type:'penecho-widget-state',selected:true,active:true,interactive:true,scaleX:1,scaleY:1},location.origin);}
addEventListener('message',event=>{if(event.source!==host.contentWindow)return;if(event.data.type==='penecho-widget-host-ready'&&!loaded){loaded=true;show();}if(event.data.type==='penecho-widget-capture-ready')status.textContent='已完成首次布局';if(event.data.type==='penecho-widget-snapshot')status.textContent='截图成功 '+event.data.width+' × '+event.data.height;if(event.data.type==='penecho-widget-snapshot-error')status.textContent='截图失败 '+event.data.error;if(event.data.type==='penecho-widget-runtime-diagnostics'&&event.data.errors.length)status.textContent=JSON.stringify(event.data.errors)});
document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{host.style.width=button.dataset.width+'px';status.textContent='当前宽度 '+button.dataset.width+' px'});select.onchange=show;
document.querySelector('#zoom').onclick=()=>{host.style.transform=host.style.transform?'':'scale(.8)';host.style.transformOrigin='top left';status.textContent='仅改变外层变换';};
document.querySelector('#height').onclick=()=>{host.style.height=host.offsetHeight===2200?'2300px':'2200px';status.textContent='仅改变容器高度';};
document.querySelector('#capture').onclick=()=>{host.style.width='1000px';host.contentWindow.postMessage({type:'penecho-widget-snapshot-request',requestId:'responsive-'+Date.now(),width:1000,height:host.clientHeight,timeoutMs:15000,fullContent:true},location.origin);status.textContent='正在等待当前宽度布局并截图';};
</script></html>
