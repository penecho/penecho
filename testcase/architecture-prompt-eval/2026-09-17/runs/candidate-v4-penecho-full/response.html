<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PenEcho 项目架构</title>
<style>
  :root{ font-size:16px; }
  html,body{ margin:0; padding:0; }
  body{ font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif; background:#f5f6f8; color:#1c2430; }
  .wrap{ width:100%; min-width:0; padding:18px; box-sizing:border-box; }
  .card{ background:#ffffff; border:1px solid #dfe3ea; border-radius:10px; padding:18px 22px 14px; max-width:1480px; margin:0 auto; }
  h1{ font-size:22px; margin:0 0 2px; letter-spacing:.5px; }
  .sub{ font-size:13px; color:#5a6472; margin:0 0 12px; }
  .badges{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .badge{ font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid #cdd4de; background:#f2f4f8; color:#3d4757; }
  svg{ width:100%; height:auto; display:block; }
  text{ font-family:inherit; }
  .legend{ display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:#3d4757; margin-top:8px; padding-top:8px; border-top:1px dashed #dfe3ea; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .sw{ width:12px; height:12px; border-radius:3px; display:inline-block; border-width:1.5px; border-style:solid; }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>PenEcho 项目架构</h1>
  <p class="sub">浏览器 Canvas · 本地 Node 服务 · 外部模型与 MCP Agent —— 单一本地服务，四类职责</p>
  <div class="badges">
    <span class="badge">画布 20000×20000 逻辑坐标</span>
    <span class="badge">512×512 稀疏瓦片</span>
    <span class="badge">模型凭据不进入浏览器</span>
    <span class="badge">启动入口：Electron 主进程 / CLI</span>
  </div>
  <svg id="arch" viewBox="0 0 1400 980" role="img" aria-label="PenEcho 项目架构图"></svg>
  <div class="legend">
    <span><i class="sw" style="background:#eaf2fc;border-color:#2f6fb5"></i>浏览器端</span>
    <span><i class="sw" style="background:#e6f5f3;border-color:#1f8a80"></i>本地服务组件</span>
    <span><i class="sw" style="background:#fdeee0;border-color:#d97a2b"></i>AI 请求管线 / 模型适配器</span>
    <span><i class="sw" style="background:#f1ebfa;border-color:#7a4fbf"></i>MCP</span>
    <span><i class="sw" style="background:#e9f6ec;border-color:#2e8b57"></i>外部模型 / Agent</span>
    <span><i class="sw" style="background:#f2f3f6;border-color:#8a93a3;border-style:dashed"></i>启动入口</span>
  </div>
</div></div>

<script>
const svg = document.getElementById('arch');
const NS = 'http://www.w3.org/2000/svg';
function el(n,a,parent){ const e=document.createElementNS(NS,n); for(const k in a)e.setAttribute(k,a[k]); (parent||svg).appendChild(e); return e; }
function txt(x,y,s,o={}){ const t=el('text',{x,y,'font-size':o.fs||12,fill:o.fill||'#1c2430','text-anchor':o.anchor||'start','font-weight':o.fw||400}); t.textContent=s; return t; }

// ---- defs: arrowheads ----
const defs = el('defs',{});
function marker(id,color){ const m=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs); el('path',{d:'M0,0 L10,5 L0,10 z',fill:color},m); }
marker('arr','#3d4757'); marker('arrB','#2f6fb5'); marker('arrO','#d97a2b'); marker('arrP','#7a4fbf'); marker('arrG','#2e8b57'); marker('arrT','#1f8a80');

// ---- groups (boundaries) ----
const groups = [
 {id:'gBrowser', x:40,  y:140, w:300, h:440, title:'浏览器（Canvas）', fill:'#f4f9ff', stroke:'#2f6fb5', dash:false},
 {id:'gServer',  x:430, y:120, w:560, h:600, title:'本地 Node 服务（同一进程，不同职责）', fill:'#f7fcfb', stroke:'#1f8a80', dash:false},
 {id:'gModels',  x:1030,y:150, w:330, h:200, title:'外部模型服务', fill:'#f4fbf6', stroke:'#2e8b57', dash:true},
 {id:'gMcpA',    x:1030,y:430, w:330, h:130, title:'外部 MCP Agent', fill:'#faf7fe', stroke:'#7a4fbf', dash:true},
];
const G = {};
for(const g of groups){
  G[g.id]=g;
  el('rect',{x:g.x,y:g.y,width:g.w,height:g.h,rx:12,fill:g.fill,stroke:g.stroke,'stroke-width':1.5,'stroke-dasharray':g.dash?'6 4':'none'});
  txt(g.x+14,g.y+22,g.title,{fs:13,fw:600,fill:g.stroke});
}

// ---- nodes ----
const nodes = {};
function node(id,x,y,w,h,lines,opt={}){
  nodes[id]={id,x,y,w,h};
  const fill=opt.fill||'#ffffff', stroke=opt.stroke||'#5a6472';
  el('rect',{x,y,width:w,height:h,rx:8,fill,stroke,'stroke-width':1.4});
  const n=lines.length, lh=15;
  lines.forEach((s,i)=>{
    const fs = i===0? (opt.fs||13):(opt.fs2||11);
    const fw = i===0? 600:400;
    txt(x+w/2, y+h/2 + (i-(n-1)/2)*lh + fs*0.35, s, {fs, fw, anchor:'middle', fill:i===0?'#1c2430':'#5a6472'});
  });
}

// browser side
node('draw',   70,180,240,52,['绘制交互','画布渲染 · 选择 · 编辑'],{fill:'#eaf2fc',stroke:'#2f6fb5'});
node('widget', 70,250,240,52,['Widget 展示','结构化指令渲染 · 草稿预览'],{fill:'#eaf2fc',stroke:'#2f6fb5'});
node('idb',    70,320,240,48,['IndexedDB','本地画布快照（浏览器持有）'],{fill:'#eaf2fc',stroke:'#2f6fb5'});
node('user',   70,388,240,44,['用户确认','草稿 → 确认后落盘'],{fill:'#ffffff',stroke:'#2f6fb5'});
node('fe',     70,456,240,44,['前端 src/client/app/','构建产物 → public/app.js'],{fill:'#ffffff',stroke:'#9db8d6','stroke-dasharray':'4 3',fs:12});

// server side
node('httpapi',470,180,220,60,['静态资源 / HTTP API','服务入口 · 请求分发'],{fill:'#e6f5f3',stroke:'#1f8a80'});
node('pipeline',730,180,230,60,['Canvas AI 请求管线','编排 · 校验 · 日志'],{fill:'#fdeee0',stroke:'#d97a2b'});
node('adapter',730,272,230,52,['模型适配器','api · codex/claude/kimi-cli'],{fill:'#fdeee0',stroke:'#d97a2b',fs2:10.5});
node('agent',  470,330,220,60,['Canvas Agent','WebSocket 接入 · 文档工具'],{fill:'#e6f5f3',stroke:'#1f8a80'});
node('mcp',    470,490,220,60,['MCP 服务','src/server/mcp/'],{fill:'#f1ebfa',stroke:'#7a4fbf'});
node('store',  730,490,230,60,['connections.json','请求日志（服务端持有）'],{fill:'#ffffff',stroke:'#1f8a80','stroke-dasharray':'4 3'});
node('srvmain',470,580,220,44,['src/server/main.js','服务端入口'],{fill:'#ffffff',stroke:'#9cc4bf','stroke-dasharray':'4 3',fs:12});
node('cvs',    730,580,230,44,['Canvas 数据','逻辑坐标 · 稀疏瓦片存储'],{fill:'#ffffff',stroke:'#9cc4bf','stroke-dasharray':'4 3',fs:12});

// external models chips
node('mApi',  1050,182,140,40,['模型 API','HTTPS'],{fill:'#e9f6ec',stroke:'#2e8b57',fs:12,fs2:10});
node('mCli',  1210,182,140,40,['本地 CLI 子进程','codex/claude/kimi'],{fill:'#e9f6ec',stroke:'#2e8b57',fs:12,fs2:10});
txt(1195,252,'模型连接与凭据仅存在于服务端',{fs:10.5,fill:'#3a7a52',anchor:'middle'});

// external mcp agent
node('mcpclient',1050,470,290,56,['MCP 客户端','外部 AI Agent · 工具调用'],{fill:'#f1ebfa',stroke:'#7a4fbf'});

// startup entries
node('electron',430,790,240,56,['Electron 主进程','加载本地服务器 · 打开窗口'],{fill:'#f2f3f6',stroke:'#8a93a3'});
node('cli',     720,790,240,56,['CLI 启动','同一服务器的另一入口'],{fill:'#f2f3f6',stroke:'#8a93a3'});

// mathjax note
node('mathjax',1050,620,290,48,['MathJax（jsDelivr CDN）','由浏览器直连，不经本地服务'],{fill:'#ffffff',stroke:'#8a93a3','stroke-dasharray':'4 3',fs:12});

// ---- edges ----
function edge(from,to,waypoints,opt={}){
  const f=nodes[from], t=nodes[to];
  const pts=[...waypoints];
  const d = 'M'+pts.map(p=>p.join(',')).join(' L');
  el('path',{d,fill:'none',stroke:opt.color||'#3d4757','stroke-width':opt.w||1.6,'stroke-dasharray':opt.dash?'6 4':'none','marker-end':`url(#${opt.mk||'arr'})`});
  if(opt.label){
    // place label at given point
    const [lx,ly]=opt.at; 
    const bg=el('rect',{x:lx-opt.lw/2||0,y:ly-9,width:opt.lw||100,height:16,rx:8,fill:'#ffffff',stroke:'none',opacity:.92});
    txt(lx,ly+3,opt.label,{fs:opt.fs||11,fill:opt.lfill||'#3d4757',anchor:'middle',fw:500});
  }
}

// helper port points
const R=(n,dx=0)=>[nodes[n].x+nodes[n].w+dx, nodes[n].y+nodes[n].h/2];
const L=n=>[nodes[n].x, nodes[n].y+nodes[n].h/2];
const T=n=>[nodes[n].x+nodes[n].w/2, nodes[n].y];
const B=n=>[nodes[n].x+nodes[n].w/2, nodes[n].y+nodes[n].h];

// 1 browser -> httpapi (POST /api/ai/command)
edge('draw','httpapi',[R('draw'),[440,206],L('httpapi')],{color:'#2f6fb5',mk:'arrB',label:'POST /api/ai/command',at:[408,164],lw:150,lfill:'#2f6fb5'});
// 2 httpapi -> pipeline
edge('httpapi','pipeline',[R('httpapi'),L('pipeline')],{color:'#d97a2b',mk:'arrO',label:'转发请求',at:[710,166],lw:70});
// 3 pipeline -> adapter
edge('pipeline','adapter',[B('pipeline'),T('adapter')],{color:'#d97a2b',mk:'arrO'});
// 4 adapter -> models
edge('adapter','mApi',[R('adapter'),[1000,207],L('mApi')],{color:'#2e8b57',mk:'arrG',label:'模型调用',at:[1000,168],lw:70,lfill:'#2e8b57'});
edge('adapter','mCli',[ [nodes['adapter'].x+nodes['adapter'].w-40,nodes['adapter'].y+nodes['adapter'].h],[nodes['adapter'].x+nodes['adapter'].w-40,340],[1000,340],[1000,222],L('mCli')],{color:'#2e8b57',mk:'arrG'});
// 5 adapter -> browser (structured instructions / draft)
edge('adapter','widget',[T('adapter'),[845,150],[408,150],T('widget')],{color:'#d97a2b',mk:'arrO',dash:true,label:'返回结构化绘图指令 → 草稿预览',at:[620,143],lw:220,lfill:'#b35c14'});
// 6 browser <-> agent (WebSocket)
edge('agent','draw',[L('agent'),[385,360],[385,278],[310,278] ],{color:'#1f8a80',mk:'arrT',label:'WebSocket',at:[385,340],lw:80,lfill:'#1f8a80'});
edge('draw','agent',[ [nodes['draw'].x+nodes['draw'].w,222],[385,222],[385,352],[L('agent')[0],352] ],{color:'#1f8a80',mk:'arrT',dash:true});
// 7 agent -> models (model connection)
edge('agent','mApi',[ [nodes['agent'].x+nodes['agent'].w,nodes['agent'].y+22],[1000,352],[1000,207],[nodes['mApi'].x,207] ],{color:'#2e8b57',mk:'arrG',label:'Agent 模型连接',at:[930,368],lw:110,lfill:'#2e8b57'});
// 8 mcp agent -> mcp service (HTTPS MCP)
edge('mcpclient','mcp',[L('mcpclient'),[1000,498],R('mcp')],{color:'#7a4fbf',mk:'arrP',label:'HTTPS MCP 调用',at:[880,484],lw:110,lfill:'#7a4fbf'});
// 9 mcp -> browser via authorized channel
edge('mcp','draw',[L('mcp'),[385,520],[385,340]],[0].length?[L('mcp'),[385,520],[385,300],[310,300]]:0,{color:'#7a4fbf',mk:'arrP',label:'已授权浏览器通道 · 读写 Canvas',at:[385,430],lw:0,lfill:'#7a4fbf'});
// label text is wide; draw side label instead
txt(360,432,'已授权浏览器通道',{fs:10.5,fill:'#7a4fbf',anchor:'end'});
txt(360,446,'读写同一 Canvas',{fs:10.5,fill:'#7a4fbf',anchor:'end'});
// 10 startup arrows
edge('electron','srvmain',[T('electron'),B('srvmain')],{color:'#8a93a3',dash:true,label:'启动',at:[450,768],lw:40,lfill:'#5a6472'});
edge('cli','srvmain',[B('srvmain')[0]+60,818],[nodes['srvmain'].x+120,624] ,{color:'#8a93a3',dash:true});
edge('cli','electron',[ [nodes['cli'].x,818],[nodes['electron'].x+nodes['electron'].w,818] ],{color:'#8a93a3',dash:true,label:'同一服务器',at:[695,832],lw:80,lfill:'#5a6472'});
// 11 browser -> mathjax (direct)
edge('user','mathjax',[B('user'),[190,740],[1000,740],[1000,644],L('mathjax')],{color:'#8a93a3',dash:true,label:'浏览器直连 jsDelivr（HTTPS）',at:[600,730],lw:190,lfill:'#5a6472'});
// 12 httpapi <-> store implied: pipeline logs
edge('pipeline','store',[ [nodes['pipeline'].x+40,nodes['pipeline'].y+nodes['pipeline'].h],[770,272] ],{color:'#1f8a80',dash:true});
edge('store','pipeline',[ [880,490],[845,240] ],{color:'#1f8a80',dash:true,mk:'arrO'});
// widget -> user confirm
edge('widget','user',[ [nodes['widget'].x+40,nodes['widget'].y+nodes['widget'].h],[120,388] ],{color:'#2f6fb5',mk:'arrB'});
// user -> draw (apply to canvas)
edge('user','draw',[ [nodes['user'].x+200,410],[290,410],[290,232],[nodes['draw'].x+nodes['draw'].w,232] ],{color:'#2f6fb5',mk:'arrB',label:'确认写入',at:[290,418],lw:70,lfill:'#2f6fb5'});
// idb <-> draw
edge('draw','idb',[ [nodes['draw'].x+50,nodes['draw'].y+nodes['draw'].h],[120,320] ],{color:'#2f6fb5',dash:true,label:'快照存取',at:[110,308],lw:70,lfill:'#2f6fb5'});

// footnote
txt(40,930,'路径索引：前端 src/client/app/ → public/app.js ｜ 服务端 src/server/main.js ｜ Agent src/server/canvas-agent/ ｜ MCP src/server/mcp/ ｜ 画布 20000×20000 逻辑坐标 · 512×512 稀疏瓦片',{fs:11,fill:'#7a8494'});
</script>
</body>
</html>
