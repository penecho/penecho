"label":"异步回调","kind":"return"},{"from":"pay","to":"mq","label":"支付成功事件","kind":"data"},{"from":"mq","to":"inv","label":"确认扣减","kind":"optional"},{"from":"inv","to":"order","label":"库存结果","kind":"return"}],"details":[{"title":"一致性策略","domain":"data","items":["订单与库存分库，通过本地消息表 + Kafka 实现最终一致。","幂等键写入 Redis，避免重复下单。"]},{"title":"失败处理","domain":"svc","items":["支付超时 15 分钟后自动释放库存。","回调签名校验失败直接丢弃并告警。"]}],"notes":["未画出对账任务与风控服务。"]}</script><p role="status">正在布局架构图…</p></section><script>addEventListener('penecho-architecture-ready',()=>{
    const originalSettled=globalThis['__penechoArchitectureWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-architecture]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-architecture-source]').textContent;

    root.querySelector('[data-view="fit"]').click();
    })();
