<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-workflow><script type="application/json" data-workflow-source>{"description":"三级嵌套分组 + 横向布局：值班体系 / 一线值班 / 自动化处置","details":[{"domain":"auto","items":["自动诊断读取最近 15 分钟指标与日志。","自动重启最多执行 2 次。"],"title":"自动化边界"},{"domain":"oncall","items":["一线 30 分钟未解决自动升级二线。","复盘在事件关闭后 48 小时内完成。"],"title":"升级规则"}],"direction":"RIGHT","domains":[{"color":"blue","id":"watch","label":"值班体系"},{"color":"teal","id":"oncall","label":"一线值班"},{"color":"green","id":"auto","label":"自动化处置"},{"color":"slate","id":"review","label":"复盘通道"}],"edges":[{"from":"alert","to":"diag"},{"from":"diag","to":"auto_dec"},{"from":"auto_dec","label":"可自动恢复","to":"restart"},{"from":"auto_dec","label":"需人工判断","to":"line1"},{"from":"restart","to":"verify"},{"from":"verify","label":"恢复成功","to":"postmortem"},{"from":"verify","label":"仍异常","to":"line1"},{"from":"line1","label":"一线已解决","to":"postmortem"},{"from":"line1","label":"需升级","to":"line2"},{"from":"line2","to":"postmortem"},{"from":"postmortem","to":"done"}],"groups":[{"domain":"watch","id":"g_watch","label":"值班体系"},{"domain":"oncall","id":"g_line1","label":"一线值班","parent":"g_watch"},{"domain":"auto","id":"g_auto","label":"自动化处置","parent":"g_watch"},{"domain":"review","id":"g_review","label":"复盘通道"}],"nodes":[{"domain":"watch","id":"alert","label":"监控告警触发","subtitle":"P1/P2 分级","type":"start"},{"domain":"auto","group":"g_auto","id":"diag","label":"自动诊断","subtitle":"指标 + 日志","type":"process"},{"domain":"auto","group":"g_auto","id":"auto_dec","label":"是否可自动恢复？","type":"decision"},{"domain":"auto","group":"g_auto","id":"restart","label":"自动重启 Pod","subtitle":"最多 2 次","type":"process"},{"domain":"oncall","group":"g_line1","id":"verify","label":"恢复是否成功？","type":"decision"},{"domain":"oncall","group":"g_line1","id":"line1","label":"一线值班是否解决？","subtitle":"30 分钟时限","type":"decision"},{"domain":"watch","group":"g_watch","id":"line2","label":"二线专家介入","subtitle":"跨团队会诊","type":"process"},{"domain":"review","group":"g_review","id":"postmortem","label":"变更复盘","subtitle":"48 小时内","type":"process"},{"domain":"watch","id":"done","label":"值班结束","type":"end"}],"notes":["分组表示责任边界，不代表独立部署单元。"],"title":"值班响应流程（多级分组）","version":1}</script><p role="status">正在布局流程图…</p></section><script>addEventListener('penecho-workflow-ready',()=>{
    const originalSettled=globalThis['__penechoWorkflowWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-workflow]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-workflow-source]').textContent;

    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"W5",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-workflow-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
