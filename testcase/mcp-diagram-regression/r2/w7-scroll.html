<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-workflow><script type="application/json" data-workflow-source>{"description":"超长标签、HTML 特殊字符、emoji、三路 fork 与四路 decision","details":[{"domain":"flow","items":["所有判断节点都必须有至少两个带条件标签的出边。","环路必须标记为 loop 并写清重试条件。"],"title":"建模规则"},{"domain":"fail","items":["失败路径统一走补偿事务。","补偿失败时人工介入。"],"title":"异常处理"}],"domains":[{"color":"blue","id":"flow","label":"主流程"},{"color":"green","id":"ok","label":"成功路径"},{"color":"slate","id":"fail","label":"异常路径"}],"edges":[{"from":"start","to":"d1"},{"from":"d1","label":"有效","to":"d2"},{"from":"d1","label":"无效 \u003cinvalid\u003e","to":"deny"},{"from":"deny","to":"done_fail"},{"from":"d2","label":"充足","to":"fan"},{"from":"d2","label":"不足 \u0026 已排队","to":"throttle"},{"from":"throttle","kind":"loop","label":"退避后重试（最多 5 次）","to":"d2"},{"from":"fan","to":"b1"},{"from":"fan","to":"b2"},{"from":"fan","to":"b3"},{"from":"b1","to":"merge"},{"from":"b2","to":"merge"},{"from":"b3","to":"merge"},{"from":"merge","to":"d3"},{"from":"d3","label":"全部成功 ✅","to":"done"},{"from":"d3","label":"任一步骤失败 ⚠️","to":"compensate"},{"from":"compensate","label":"补偿完成","to":"done_fail"}],"nodes":[{"domain":"flow","id":"start","label":"请求进入 gateway \u0026 鉴权","subtitle":"符号 \u003ctag\u003e \"quote\" 'apos' | \\slash/ #hash% {brace}","type":"start"},{"domain":"flow","id":"d1","label":"Token 是否有效？","type":"decision"},{"domain":"fail","id":"deny","label":"拒绝并返回 401 ✅","subtitle":"鉴权失败告警","type":"process"},{"domain":"flow","id":"d2","label":"配额是否充足？","type":"decision"},{"domain":"fail","id":"throttle","label":"限流与退避 ⚠️","subtitle":"指数退避，最多 5 次","type":"process"},{"domain":"flow","id":"fan","label":"并行处理三路任务","type":"fork"},{"domain":"ok","id":"b1","label":"分支一：写入主库","type":"process"},{"domain":"ok","id":"b2","label":"分支二：同步搜索索引","subtitle":"这一条副标题被故意写得很长，用于验证副标题在接近一百六十字符上限时的换行、行高与截断策略是否稳定，并且不会溢出节点边框或遮挡下方节点","type":"process"},{"domain":"ok","id":"b3","label":"分支三：发送通知 🚀","type":"process"},{"domain":"flow","id":"merge","label":"汇总三路结果","type":"join"},{"domain":"flow","id":"d3","label":"是否全部成功？","type":"decision"},{"domain":"fail","id":"compensate","label":"补偿事务 / rollback","subtitle":"回滚已完成的写入","type":"process"},{"domain":"ok","id":"done","label":"处理完成 🚀","type":"end"},{"domain":"fail","id":"done_fail","label":"流程终止 ❌","type":"end"}],"notes":["本样本故意混入 \u003ctag\u003e、\u0026、\"quotes\"、emoji，用于验证转义与字体回退。"],"title":"异常与配额处理（长文本 + 特殊字符）","version":1}</script><p role="status">正在布局流程图…</p></section><script>addEventListener('penecho-workflow-ready',()=>{
    const originalSettled=globalThis['__penechoWorkflowWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-workflow]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-workflow-source]').textContent;
    const overview={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    const nodes=[...svg.querySelectorAll('[data-node-id]')],select=root.querySelector('.pa-view-controls select');
    let allNodesReachable=true;const failures=[];
    for(const node of nodes){select.value=node.dataset.nodeId;select.dispatchEvent(new Event('change'));const b=node.getBoundingClientRect(),m=map.getBoundingClientRect(),x=m.left+map.clientLeft,y=m.top+map.clientTop;const ok=b.left>=x-1&&b.top>=y-1&&b.right<=x+map.clientWidth+1&&b.bottom<=y+map.clientHeight+1;allNodesReachable&&=ok;if(!ok)failures.push(node.dataset.nodeId);}
    root.querySelector('[data-view="actual"]').click();
    const at100={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    map.scrollLeft=map.scrollTop=0;map.scrollBy({left:500,top:500,behavior:'instant'});
    const scrollMoved=(at100.scrollWidth<=at100.width||map.scrollLeft>0)&&(at100.scrollHeight<=at100.height||map.scrollTop>0);
    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);
    map.scrollLeft=map.scrollWidth;map.scrollTop=map.scrollHeight;
    const reachedEnd=map.scrollLeft+map.clientWidth>=map.scrollWidth-1&&map.scrollTop+map.clientHeight>=map.scrollHeight-1;
    await new Promise(resolve=>setTimeout(resolve,250));
    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"W7",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-workflow-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoWorkflowWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body></html>
