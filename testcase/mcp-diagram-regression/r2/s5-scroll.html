<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-sequence><script type="application/json" data-sequence-source>{"description":"夜间对账：批处理自调用、重试与人工介入","details":[{"items":["差异金额 \u003e 1000 元 或 条数 \u003e 50 时告警。","连续两次失败升级为 P1 事件。"],"title":"阈值与升级"},{"items":["分页大小 5000 条，避免长事务。","差异记录写入独立表，不修改原始流水。"],"title":"实现约束"}],"domains":[{"color":"teal","id":"job","label":"作业"},{"color":"purple","id":"data","label":"数据"},{"color":"slate","id":"human","label":"人工"}],"messages":[{"from":"sched","id":"a1","label":"trigger 02:00","to":"job"},{"from":"job","id":"a2","label":"分页处理每批 5000 条","note":"自调用：循环直到无剩余数据","to":"job"},{"from":"job","id":"a3","label":"读取当日流水","to":"db"},{"from":"db","id":"a4","kind":"return","label":"批次结果集","to":"job"},{"from":"job","id":"a5","label":"写回差异记录","to":"db"},{"from":"job","id":"a6","kind":"async","label":"差异超阈值时通知","to":"ops"},{"from":"ops","id":"a7","kind":"return","label":"人工确认（可选）","to":"job"}],"notes":["自调用表示作业内部的批处理循环，不是远程调用。"],"participants":[{"domain":"job","id":"sched","label":"调度器","subtitle":"Cron"},{"domain":"job","id":"job","label":"对账作业","subtitle":"batch worker"},{"domain":"data","id":"db","label":"账务库","subtitle":"PostgreSQL","type":"database"},{"domain":"human","id":"ops","label":"值班人员","subtitle":"人工介入","type":"external"}],"title":"定时对账任务（自调用与重试）","version":1}</script><p role="status">正在布局时序图…</p></section><script>addEventListener('penecho-sequence-ready',()=>{
    const originalSettled=globalThis['__penechoSequenceWhenSettled'];

    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
