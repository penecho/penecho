<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-sequence><script type="application/json" data-sequence-source>{"description":"Checkout to PSP: retry loop, optional 3DS and success/decline alternatives inside one critical section.","details":[{"domain":"svc","items":["Idempotency-Key is sent on every retry.","Ledger writes are keyed by intent id."],"title":"Idempotency"},{"domain":"store","items":["The ledger is append-only.","Settlement events are consumed by the reporting job."],"title":"Storage"}],"domains":[{"color":"blue","id":"client","label":"Client"},{"color":"orange","id":"svc","label":"Service"},{"color":"slate","id":"ext","label":"PSP"},{"color":"purple","id":"store","label":"Data"}],"fragments":[{"from":"p2","kind":"critical","label":"Critical: single settlement","to":"p16"},{"from":"p3","kind":"loop","label":"Retry up to 3x on 5xx","to":"p4"},{"from":"p6","kind":"opt","label":"3DS required","to":"p8"},{"branches":[{"from":"p15","label":"Declined"}],"from":"p11","kind":"alt","label":"Succeeded","to":"p16"}],"messages":[{"from":"user","id":"p1","label":"Submit payment","to":"checkout"},{"from":"checkout","id":"p2","label":"POST /payments","to":"pay"},{"from":"pay","id":"p3","label":"create PaymentIntent","to":"psp"},{"from":"psp","id":"p4","kind":"return","label":"intent + client_secret","to":"pay"},{"from":"checkout","id":"p5","label":"confirmCardPayment()","to":"psp"},{"from":"psp","id":"p6","kind":"return","label":"3DS challenge required","to":"checkout"},{"from":"checkout","id":"p7","label":"Show challenge modal","to":"user"},{"from":"user","id":"p8","kind":"return","label":"Challenge completed","to":"checkout"},{"from":"checkout","id":"p9","label":"POST /payments/confirm","to":"pay"},{"from":"pay","id":"p10","label":"confirm intent","to":"psp"},{"from":"psp","id":"p11","kind":"return","label":"succeeded","to":"pay"},{"from":"pay","id":"p12","label":"write ledger entry","to":"ledger"},{"from":"pay","id":"p13","kind":"async","label":"publish payment.settled","to":"queue"},{"from":"pay","id":"p14","kind":"return","label":"200 OK","to":"checkout"},{"from":"pay","id":"p15","label":"write failed attempt","to":"ledger"},{"from":"pay","id":"p16","kind":"return","label":"402 Declined","to":"checkout"}],"notes":["Amounts and retry counts are illustrative."],"participants":[{"domain":"client","id":"user","label":"User","subtitle":"browser","type":"frontend"},{"domain":"client","id":"checkout","label":"Checkout UI","subtitle":"SDK widget","type":"frontend"},{"domain":"svc","id":"pay","label":"Payment API","subtitle":"orchestrator"},{"domain":"ext","id":"psp","label":"Stripe PSP","subtitle":"external gateway","type":"external"},{"domain":"store","id":"ledger","label":"Ledger DB","subtitle":"double-entry","type":"database"},{"domain":"store","id":"queue","label":"Event Bus","subtitle":"topic payments.v1","type":"messagebus"}],"title":"Card Payment with 3DS and Retry","version":1}</script><p role="status">正在布局时序图…</p></section><script>addEventListener('penecho-sequence-ready',()=>{
    const originalSettled=globalThis['__penechoSequenceWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-sequence]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-sequence-source]').textContent;
    const overview={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    const nodes=[...svg.querySelectorAll('[data-node-id]')],select=root.querySelector('.pa-view-controls select');
    let allNodesReachable=true;const failures=[];
    for(const node of nodes){select.value=node.dataset.nodeId;select.dispatchEvent(new Event('change'));const b=node.getBoundingClientRect(),m=map.getBoundingClientRect(),x=m.left+map.clientLeft,y=m.top+map.clientTop;const ok=b.left>=x-1&&b.top>=y-1&&b.right<=x+map.clientWidth+1&&b.bottom<=y+map.clientHeight+1;allNodesReachable&&=ok;if(!ok)failures.push(node.dataset.nodeId);}
    root.querySelector('[data-view="actual"]').click();
    const at100={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    map.scrollLeft=map.scrollTop=0;map.scrollBy({left:500,top:500,behavior:'instant'});
    const scrollMoved=(at100.scrollWidth<=at100.width||map.scrollLeft>0)&&(at100.scrollHeight<=at100.height||map.scrollTop>0);
    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);
    map.scrollLeft=map.scrollWidth;map.scrollTop=map.scrollHeight;
    const reachedEnd=map.scrollLeft+map.clientWidth>=map.scrollWidth-1&&map.scrollTop+map.clientHeight>=map.scrollHeight-1;
    await new Promise(resolve=>setTimeout(resolve,250));
    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"S4",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-sequence-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoSequenceWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body></html>
