<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-sequence><script type="application/json" data-sequence-source>{"description":"标签长度接近文档上限：参与者 100 字符、副标题 160 字符、消息标签 120 字符、note 400 字符","details":[{"items":["参与者标签上限 100 字符。","副标题上限 160 字符。"],"title":"文档上限"},{"items":["消息标签上限 120 字符，note 上限 400 字符。","超出上限应被拒绝，而不是静默截断。"],"title":"消息上限"}],"domains":[{"color":"blue","id":"a","label":"长标签域"},{"color":"orange","id":"b","label":"对照域"}],"messages":[{"from":"p_cn","id":"q1","label":"一条非常长的消息标签用于验证在接近一百二十字符上限时箭头标签的换行与避让策略是否会把文字压到生命线或其它标签之上","to":"p_en"},{"from":"p_en","id":"q2","kind":"return","label":"Long return: the payload contains the order snapshot, the settlement record and the audit trail identifier","to":"p_long_sub"},{"from":"p_long_sub","id":"q3","label":"self call with a very long note","note":"Note field stress: this note is intentionally long, describing the retry policy, the backoff schedule, failure escalation and the exact conditions under which the operation is abandoned. It exists to verify that a long note wraps inside its box without overlapping the lifeline, the message label or the next message in the diagram.","to":"p_long_sub"}],"notes":["本样本故意把每个标签都写到接近上限，用于观察换行、截断与避让。","如果渲染正常，应看不到横向溢出或文字压线。"],"participants":[{"domain":"a","id":"p_cn","label":"这是一个接近一百字符上限的中文参与者标签用于验证换行与截断行为是否稳定且不会遮挡生命线或相邻参与者名称","subtitle":"中文副标题也在接近上限的位置","type":"frontend"},{"domain":"b","id":"p_en","label":"A participant label close to the documented one hundred character limit used to verify wrapping","subtitle":"English subtitle also near the limit"},{"domain":"a","id":"p_long_sub","label":"Long Subtitle Holder","subtitle":"Subtitle stress: this text stays just under the documented one-hundred-sixty-character maximum so wrapping, line height and truncation can be checked"}],"title":"标签长度极限（100 / 160 / 120 / 400）","version":1}</script><p role="status">正在布局时序图…</p></section><script>addEventListener('penecho-sequence-ready',()=>{
    const originalSettled=globalThis['__penechoSequenceWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-sequence]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-sequence-source]').textContent;
    const overview={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    const nodes=[...svg.querySelectorAll('[data-node-id]')],select=root.querySelector('.pa-view-controls select');
    let allNodesReachable=true;const failures=[];
    for(const node of nodes){select.value=node.dataset.nodeId;select.dispatchEvent(new Event('change'));const b=node.getBoundingClientRect(),m=map.getBoundingClientRect(),x=m.left+map.clientLeft,y=m.top+map.clientTop;const ok=b.left>=x-1&&b.top>=y-1&&b.right<=x+map.clientWidth+1&&b.bottom<=y+map.clientHeight+1;allNodesReachable&&=ok;if(!ok)failures.push(node.dataset.nodeId);}
    root.querySelector('[data-view="actual"]').click();
    const at100={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    map.scrollLeft=map.scrollTop=0;map.scrollBy({left:500,top:500,behavior:'instant'});
    const scrollMoved=(at100.scrollWidth<=at100.width||map.scrollLeft>0)&&(at100.scrollHeight<=at100.height||map.scrollTop>0);
    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);
    map.scrollLeft=map.scrollWidth;map.scrollTop=map.scrollHeight;
    const reachedEnd=map.scrollLeft+map.clientWidth>=map.scrollWidth-1&&map.scrollTop+map.clientHeight>=map.scrollHeight-1;
    await new Promise(resolve=>setTimeout(resolve,250));
    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"S8",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-sequence-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoSequenceWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body></html>
