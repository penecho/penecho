<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-architecture><script type="application/json" data-architecture-source>{"description":"Production cluster: edge, workloads, observability, data and external dependencies.","details":[{"domain":"edge","items":["TLS terminates at the CDN; WAF inspects OWASP top-10 patterns.","SSO tokens are validated per request against the IdP."],"title":"Edge \u0026 Security"},{"domain":"data","items":["RDS holds transactional state; Redis is cache-only and safe to flush.","S3 buckets are versioned (lifecycle: 90 days, illustrative)."],"title":"Data plane"},{"domain":"obs","items":["Prometheus scrapes app pods every 30s.","Alerts dispatch a GitHub Actions runbook and page the on-call."],"title":"Observability"},{"domain":"sec","items":["Vault issues short-lived DB credentials.","No static passwords in environment variables."],"title":"Secrets"},{"domain":"app","items":["Worker and cron share the same image as the APIs.","Rolling updates keep at least 2 replicas ready."],"title":"Workloads"}],"direction":"RIGHT","domains":[{"color":"blue","id":"edge","label":"Edge"},{"color":"orange","id":"app","label":"Application"},{"color":"teal","id":"plat","label":"Platform"},{"color":"purple","id":"data","label":"Data"},{"color":"green","id":"obs","label":"Observability"},{"color":"slate","id":"sec","label":"Security / External"}],"edges":[{"from":"dns","label":"resolve A/CNAME","to":"cdn"},{"from":"cdn","label":"forward","to":"waf"},{"from":"waf","label":"allow","to":"web"},{"from":"cdn","kind":"data","label":"static assets","to":"web"},{"from":"web","label":"REST","to":"apiA"},{"from":"web","label":"REST","to":"apiB"},{"from":"apiA","kind":"data","label":"read/write","to":"rds"},{"from":"apiA","kind":"data","label":"session cache",
