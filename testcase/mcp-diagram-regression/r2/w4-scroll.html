<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-workflow><script type="application/json" data-workflow-source>{"description":"Payment gate, stock gate, parallel pick/pack fan-out and join, plus SLA branch.","details":[{"domain":"fin","items":["Authorisation is captured, not settled, until shipment.","Cancellations trigger an automatic refund."],"title":"Payment"},{"domain":"wh","items":["Zone A picks parcels, zone B picks pallets.","The join waits for both branches."],"title":"Warehouse"},{"domain":"cs","items":["SLA is 3 working days for standard shipping.","Claims are opened automatically after the SLA."],"title":"Service"},{"domain":"ops","items":["Backorders retry until stock is replenished.","Retry interval is 6 hours (illustrative)."],"title":"Stock"}],"domains":[{"color":"blue","id":"ops","label":"Order"},{"color":"teal","id":"wh","label":"Warehouse"},{"color":"orange","id":"fin","label":"Finance"},{"color":"slate","id":"cs","label":"Service"}],"edges":[{"from":"start","to":"auth"},{"from":"auth","label":"authorised","to":"stock"},{"from":"auth","label":"declined","to":"cancel"},{"from":"cancel","to":"end_fail"},{"from":"stock","label":"in stock","to":"fanout"},{"from":"stock","label":"out of stock","to":"backorder"},{"from":"backorder","kind":"loop","label":"restocked, retry","to":"stock"},{"from":"fanout","to":"pickA"},{"from":"fanout","to":"pickB"},{"from":"pickA","to":"packA"},{"from":"pickB","to":"packB"},{"from":"packA","to":"join"},{"from":"packB","to":"join"},{"from":"join","to":"ship"},{"from":"ship","to":"sla"},{"from":"sla","label":"within SLA","to":"notify"},{"from":"sla","label":"SLA breached","to":"chase"},{"from":"chase","to":"notify"},{"from":"notify","to":"end_ok"}],"groups":[{"domain":"fin","id":"g_fin","label":"Finance system"},{"domain":"wh","id":"g_wh","label":"Warehouse execution"},{"domain":"cs","id":"g_cs","label":"Customer service"}],"nodes":[{"domain":"ops","id":"start","label":"Order placed","subtitle":"storefront checkout","type":"start"},{"domain":"fin","group":"g_fin","id":"auth","label":"Payment authorised?","subtitle":"3-D Secure","type":"decision"},{"domain":"fin","group":"g_fin","id":"cancel","label":"Cancel and refund","type":"process"},{"domain":"ops","id":"stock","label":"Stock available?","subtitle":"reservation check","type":"decision"},{"domain":"ops","id":"backorder","label":"Create backorder","subtitle":"notify purchasing","type":"process"},{"domain":"wh","group":"g_wh","id":"fanout","label":"Split pick work","subtitle":"zone A / zone B","type":"fork"},{"domain":"wh","group":"g_wh","id":"pickA","label":"Pick items (zone A)","subtitle":"parcels","type":"process"},{"domain":"wh","group":"g_wh","id":"pickB","label":"Pick items (zone B)","subtitle":"pallets","type":"process"},{"domain":"wh","group":"g_wh","id":"packA","label":"Pack parcel","type":"process"},{"domain":"wh","group":"g_wh","id":"packB","label":"Pack pallet","type":"process"},{"domain":"wh","group":"g_wh","id":"join","label":"Consolidate shipment","subtitle":"wait for both branches","type":"join"},{"domain":"ops","id":"ship","label":"Hand to carrier","subtitle":"tracking number issued","type":"process"},{"domain":"ops","id":"sla","label":"Delivered within SLA?","subtitle":"3 working days","type":"decision"},{"domain":"cs","group":"g_cs","id":"chase","label":"Open carrier claim","type":"process"},{"domain":"cs","group":"g_cs","id":"notify","label":"Notify customer","subtitle":"email + in-app","type":"process"},{"domain":"ops","id":"end_ok","label":"Order complete","type":"end"},{"domain":"fin","group":"g_fin","id":"end_fail","label":"Order cancelled","type":"end"}],"notes":["Timings and thresholds are illustrative.","Parallel branches model warehouse zones, not separate systems."],"title":"Order Fulfillment","version":1}</script><p role="status">正在布局流程图…</p></section><script>addEventListener('penecho-workflow-ready',()=>{
    const originalSettled=globalThis['__penechoWorkflowWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-workflow]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-workflow-source]').textContent;
    const overview={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    const nodes=[...svg.querySelectorAll('[data-node-id]')],select=root.querySelector('.pa-view-controls select');
    let allNodesReachable=true;const failures=[];
    for(const node of nodes){select.value=node.dataset.nodeId;select.dispatchEvent(new Event('change'));const b=node.getBoundingClientRect(),m=map.getBoundingClientRect(),x=m.left+map.clientLeft,y=m.top+map.clientTop;const ok=b.left>=x-1&&b.top>=y-1&&b.right<=x+map.clientWidth+1&&b.bottom<=y+map.clientHeight+1;allNodesReachable&&=ok;if(!ok)failures.push(node.dataset.nodeId);}
    root.querySelector('[data-view="actual"]').click();
    const at100={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    map.scrollLeft=map.scrollTop=0;map.scrollBy({left:500,top:500,behavior:'instant'});
    const scrollMoved=(at100.scrollWidth<=at100.width||map.scrollLeft>0)&&(at100.scrollHeight<=at100.height||map.scrollTop>0);
    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);
    map.scrollLeft=map.scrollWidth;map.scrollTop=map.scrollHeight;
    const reachedEnd=map.scrollLeft+map.clientWidth>=map.scrollWidth-1&&map.scrollTop+map.clientHeight>=map.scrollHeight-1;
    await new Promise(resolve=>setTimeout(resolve,250));
    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"W4",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-workflow-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoWorkflowWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body></html>
