<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-workflow><script type="application/json" data-workflow-source>{"description":"提交 → 凭证校验 → 金额分支 → 打款，含驳回重提环路","details":[{"domain":"fin","items":["5000 元以上需要总监审批。","打款在审批通过后 T+1 执行。"],"title":"审批规则"},{"domain":"biz","items":["凭证不齐时退回补充，重新提交。","同一单号重复提交视为幂等覆盖。"],"title":"重提规则"}],"domains":[{"color":"blue","id":"biz","label":"业务"},{"color":"orange","id":"fin","label":"财务"}],"edges":[{"from":"s","to":"sub"},{"from":"sub","to":"ok"},{"from":"ok","label":"齐全","to":"amt"},{"from":"ok","label":"不齐全","to":"fix"},{"from":"fix","kind":"loop","label":"补充后重新提交","to":"sub"},{"from":"amt","label":"≤ 5000 元","to":"mgr"},{"from":"amt","label":"\u003e 5000 元","to":"dir"},{"from":"mgr","to":"pay"},{"from":"dir","to":"pay"},{"from":"pay","to":"e"}],"nodes":[{"domain":"biz","id":"s","label":"员工发起报销","type":"start"},{"domain":"biz","id":"sub","label":"填写并提交报销单","type":"process"},{"domain":"biz","id":"ok","label":"凭证是否齐全？","type":"decision"},{"domain":"biz","id":"fix","label":"补充凭证","subtitle":"上传缺失的发票","type":"process"},{"domain":"fin","id":"amt","label":"金额是否超过 5000 元？","type":"decision"},{"domain":"biz","id":"mgr","label":"主管审批","type":"process"},{"domain":"fin","id":"dir","label":"总监审批","subtitle":"大额双签","type":"process"},{"domain":"fin","id":"pay","label":"财务打款","type":"process"},{"domain":"fin","id":"e","label":"流程结束","type":"end"}],"notes":["金额阈值与时限为示意值。","重提环路指向「提交」而非 start：start 不允许有入边。"],"title":"报销单审批","version":1}</script><p role="status">正在布局流程图…</p></section><script>addEventListener('penecho-workflow-ready',()=>{
    const originalSettled=globalThis['__penechoWorkflowWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();

    root.querySelector('[data-view="fit"]').click();

  },{once:true});</script></body></html>
