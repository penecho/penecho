<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-architecture><script type="application/json" data-architecture-source>{"description":"同一批标签下对比 domain 配色、缺省 color、与无 domain 的表现","details":[{"domain":"edge","items":["期望：蓝色左边框。"],"title":"卡片① domain=edge"},{"domain":"line","items":["期望：蓝色左边框（对照项）。"],"title":"卡片② domain=line"},{"domain":"plain","items":["domain 未声明 color 时的默认色。"],"title":"卡片③ domain=plain"},{"domain":"slate","items":["显式声明 slate 的对照项。"],"title":"卡片④ domain=slate"},{"items":["detail 卡片不声明 domain 的默认色。"],"title":"卡片⑤ 无 domain"}],"domains":[{"color":"blue","id":"edge","label":"① edge / blue"},{"color":"blue","id":"line","label":"② line / blue"},{"id":"plain","label":"③ 无 color 字段"},{"color":"slate","id":"slate","label":"④ slate / slate"}],"edges":[{"from":"n1","label":"e1","to":"n2"},{"from":"n2","label":"e2","to":"n3"},{"from":"n3","label":"e3","to":"n4"},{"from":"n4","label":"e4","to":"n5"}],"nodes":[{"domain":"edge","id":"n1","label":"节点 A","subtitle":"domain=edge"},{"domain":"line","id":"n2","label":"节点 B","subtitle":"domain=line"},{"domain":"plain","id":"n3","label":"节点 C","subtitle":"domain=plain"},{"domain":"slate","id":"n4","label":"节点 D","subtitle":"domain=slate"},{"id":"n5","label":"节点 E","subtitle":"无 domain"}],"notes":["若卡片①与卡片②颜色不同，则说明 domain id 存在保留字冲突。"],"title":"域配色与默认值自检","version":1}</script><p role="status">正在布局架构图…</p></section><script>addEventListener('penecho-architecture-ready',()=>{
    const originalSettled=globalThis['__penechoArchitectureWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-architecture]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-architecture-source]').textContent;

    map.scrollLeft=map.scrollTop=0;map.scrollBy({left:500,top:500,behavior:'instant'});
    const scrollMoved=(at100.scrollWidth<=at100.width||map.scrollLeft>0)&&(at100.scrollHeight<=at100.height||map.scrollTop>0);
    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);

    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');

    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoArchitectureWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body></html>
