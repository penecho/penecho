 服务","subtitle":"present_widget / capture_canvas"},{"domain":"cloud","id":"store","label":"画布文档存储","subtitle":"canvas.json + widget.html","type":"database"},{"domain":"local","id":"browser","label":"浏览器画布宿主","subtitle":"本地渲染器","type":"frontend"}],"title":"present_widget 端到端调用时序（真实项目）","version":1}</script><p role="status">正在布局时序图…</p></section><script>addEventListener('penecho-sequence-ready',()=>{

    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
