<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-workflow><script type="application/json" data-workflow-source>{"description":"One fork into four region groups, eight parallel steps, one join, then a canary decision.","details":[{"domain":"run","items":["Each region runs deploy then verify.","The join waits for all four regions."],"title":"Fan-out"},{"domain":"ops","items":["Canary health is judged over 15 minutes.","Rollback restores the previous image everywhere."],"title":"Gating"},{"domain":"run","items":["Region ordering is not significant.","One region failing aborts the join."],"title":"Failure semantics"}],"domains":[{"color":"teal","id":"plat","label":"Platform"},{"color":"orange","id":"run","label":"Region rollout"},{"color":"slate","id":"ops","label":"Ops"}],"edges":[{"from":"start","to":"preflight"},{"from":"preflight","to":"fan"},{"from":"fan","to":"us_dep"},{"from":"fan","to":"eu_dep"},{"from":"fan","to":"ap_dep"},{"from":"fan","to":"sa_dep"},{"from":"us_dep","to":"us_ver"},{"from":"eu_dep","to":"eu_ver"},{"from":"ap_dep","to":"ap_ver"},{"from":"sa_dep","to":"sa_ver"},{"from":"us_ver","to":"join"},{"from":"eu_ver","to":"join"},{"from":"ap_ver","to":"join"},{"from":"sa_ver","to":"join"},{"from":"join","to":"canary"},{"from":"canary","label":"healthy","to":"promote"},{"from":"canary","label":"unhealthy","to":"rollback"},{"from":"promote","to":"end_ok"},{"from":"rollback","to":"end_fail"}],"groups":[{"domain":"plat","id":"g_us","label":"us-east-1"},{"domain":"plat","id":"g_eu","label":"eu-west-1"},{"domain":"plat","id":"g_ap","label":"ap-southeast-1"},{"domain":"plat","id":"g_sa","label":"sa-east-1"}],"nodes":[{"domain":"plat","id":"start","label":"Release approved","type":"start"},{"domain":"plat","id":"preflight","label":"Preflight checks","subtitle":"quota, DNS, certificates","type":"process"},{"domain":"run","id":"fan","label":"Fan out to regions","subtitle":"four parallel rollouts","type":"fork"},{"domain":"run","group":"g_us","id":"us_dep","label":"Deploy us-east","type":"process"},{"domain":"run","group":"g_us","id":"us_ver","label":"Verify us-east","subtitle":"smoke + synthetics","type":"process"},{"domain":"run","group":"g_eu","id":"eu_dep","label":"Deploy eu-west","type":"process"},{"domain":"run","group":"g_eu","id":"eu_ver","label":"Verify eu-west","subtitle":"smoke + synthetics","type":"process"},{"domain":"run","group":"g_ap","id":"ap_dep","label":"Deploy ap-southeast","type":"process"},{"domain":"run","group":"g_ap","id":"ap_ver","label":"Verify ap-southeast","subtitle":"smoke + synthetics","type":"process"},{"domain":"run","group":"g_sa","id":"sa_dep","label":"Deploy sa-east","type":"process"},{"domain":"run","group":"g_sa","id":"sa_ver","label":"Verify sa-east","subtitle":"smoke + synthetics","type":"process"},{"domain":"plat","id":"join","label":"All regions ready","subtitle":"wait for four branches","type":"join"},{"domain":"ops","id":"canary","label":"Canary healthy?","subtitle":"15 minute window","type":"decision"},{"domain":"ops","id":"promote","label":"Promote to full traffic","type":"process"},{"domain":"ops","id":"rollback","label":"Roll back all regions","subtitle":"restore previous image","type":"process"},{"domain":"ops","id":"end_ok","label":"Rollout complete","type":"end"},{"domain":"ops","id":"end_fail","label":"Rollout aborted","type":"end"}],"notes":["Timings are illustrative.","Region groups are deployment boundaries, not separate systems."],"title":"Multi-Region Rollout","version":1}</script><p role="status">正在布局流程图…</p></section><script>addEventListener('penecho-workflow-ready',()=>{
    const originalSettled=globalThis['__penechoWorkflowWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-workflow]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-workflow-source]').textContent;
    const overview={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    const nodes=[...svg.querySelectorAll('[data-node-id]')],select=root.querySelector('.pa-view-controls select');
    let allNodesReachable=true;const failures=[];
    for(const node of nodes){select.value=node.dataset.nodeId;select.dispatchEvent(new Event('change'));const b=node.getBoundingClientRect(),m=map.getBoundingClientRect(),x=m.left+map.clientLeft,y=m.top+map.clientTop;const ok=b.left>=x-1&&b.top>=y-1&&b.right<=x+map.clientWidth+1&&b.bottom<=y+map.clientHeight+1;allNodesReachable&&=ok;if(!ok)failures.push(node.dataset.nodeId);}
    root.querySelector('[data-view="actual"]').click();

    map.scrollLeft=map.scrollTop=0;map.scrollBy({left:500,top:500,behavior:'instant'});
    const scrollMoved=(at100.scrollWidth<=at100.width||map.scrollLeft>0)&&(at100.scrollHeight<=at100.height||map.scrollTop>0);
    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);
    map.scrollLeft=map.scrollWidth;map.scrollTop=map.scrollHeight;
    const reachedEnd=map.scrollLeft+map.clientWidth>=map.scrollWidth-1&&map.scrollTop+map.clientHeight>=map.scrollHeight-1;
    await new Promise(resolve=>setTimeout(resolve,250));
    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"W8",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-workflow-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoWorkflowWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body></html>
