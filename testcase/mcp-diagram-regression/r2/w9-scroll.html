<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>发布评审：正文讲解 + 内嵌工作流</title>
<style>
html,body{margin:0;padding:0;background:transparent}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;color:#1f2937;width:100%;min-width:0}
.wrap{padding:20px 22px 24px;background:#fff;border:1px solid #e5e7eb;border-radius:14px}
h1{font-size:20px;line-height:1.3;margin:0 0 5px;font-weight:700}
.sub{color:#6b7280;font-size:12.5px;line-height:1.6;margin:0 0 16px}
.note{font-size:12.5px;line-height:1.75;color:#374151;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;margin-top:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;background:#fcfcfd}
.card h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6b7280;margin:0 0 9px;font-weight:700}
ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.85}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid #eef0f3;padding:6px 8px;text-align:left}
th{color:#374151;font-weight:600;background:#f9fafb}
code{background:#f3f4f6;border-radius:4px;padding:0 4px;font-size:12px}
</style>
</head>
<body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre>
<div class="wrap">
  <h1>发布评审：正文讲解 + 内嵌工作流</h1>
  <p class="sub">混合文档测试样本 W9：普通 HTML 讲解 + 内嵌 workflow 语义图形（同文档、无 iframe）</p>
  <p class="note">下方工作流与正文处于同一文档。请注意判断节点的两条出边都带条件标签：<code>通过</code> 与 <code>打回</code>，这对应正文里「每个判断都必须能走回退路径」的约定。</p>
  <section data-penecho-workflow>
    <script type="application/json" data-workflow-source>{"version":1,"title":"发布评审流程（内嵌）","description":"来自 HTML 讲解中的内嵌工作流","domains":[{"id":"dev","label":"研发","color":"blue"},{"id":"qa","label":"测试","color":"teal"},{"id":"ops","label":"运维","color":"orange"}],"nodes":[{"id":"s","type":"start","label":"提交发布申请","domain":"dev"},{"id":"build","type":"process","label":"构建并归档产物","subtitle":"版本号 + 校验和","domain":"dev"},{"id":"gate","type":"decision","label":"测试是否通过？","subtitle":"回归 + 冒烟","domain":"qa"},{"id":"fix","type":"process","label":"修复后重新构建","domain":"dev"},{"id":"approve","type":"process","label":"运维审批","subtitle":"窗口期确认","domain":"ops"},{"id":"release","type":"process","label":"执行发布","domain":"ops"},{"id":"e","type":"end","label":"发布完成","domain":"ops"}],"edges":[{"from":"s","to":"build"},{"from":"build","to":"gate"},{"from":"gate","label":"通过","to":"approve"},{"from":"gate","label":"不通过","to":"fix"},{"from":"fix","kind":"loop","label":"修复后重新构建","to":"build"},{"from":"approve","to":"release"},{"from":"release","to":"e"}],"details":[{"title":"门禁","domain":"qa","items":["回归用例全绿才允许进入审批。","冒烟失败直接打回。"]}],"notes":["内嵌工作流与正文共享 domain 配色。"]}</script>
  </section>
  <div class="grid">
    <div class="card">
      <h2>三条硬性约定</h2>
      <ul>
        <li>每个判断节点至少两条带条件标签的出边。</li>
        <li>任何环路都要标成重试边并写清条件。</li>
        <li>发布的返回路径必须可回退到构建。</li>
      </ul>
    </div>
    <div class="card">
      <h2>窗口期规则</h2>
      <table>
        <tr><th>等级</th><th>窗口</th></tr>
        <tr><td>常规发布</td><td>周二 / 周四 14:00-17:00</td></tr>
        <tr><td>紧急修复</td><td>随时，需双人确认</td></tr>
        <tr><td>大版本</td><td>周五冻结</td></tr>
      </table>
    </div>
  </div>
</div>
<script>addEventListener('penecho-workflow-ready',()=>{
    const originalSettled=globalThis['__penechoWorkflowWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-workflow]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-workflow-source]').textContent;
    const overview={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    const nodes=[...svg.querySelectorAll('[data-node-id]')],select=root.querySelector('.pa-view-controls select');
    let allNodesReachable=true;const failures=[];
    for(const node of nodes){select.value=node.dataset.nodeId;select.dispatchEvent(new Event('change'));const b=node.getBoundingClientRect(),m=map.getBoundingClientRect(),x=m.left+map.clientLeft,y=m.top+map.clientTop;const ok=b.left>=x-1&&b.top>=y-1&&b.right<=x+map.clientWidth+1&&b.bottom<=y+map.clientHeight+1;allNodesReachable&&=ok;if(!ok)failures.push(node.dataset.nodeId);}
    root.querySelector('[data-view="actual"]').click();
    const at100={width:map.clientWidth,height:map.clientHeight,outerHeight:map.getBoundingClientRect().height,scrollWidth:map.scrollWidth,scrollHeight:map.scrollHeight};
    map.scrollLeft=map.scrollTop=0;map.scrollBy({left:500,top:500,behavior:'instant'});
    const scrollMoved=(at100.scrollWidth<=at100.width||map.scrollLeft>0)&&(at100.scrollHeight<=at100.height||map.scrollTop>0);
    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);
    map.scrollLeft=map.scrollWidth;map.scrollTop=map.scrollHeight;
    const reachedEnd=map.scrollLeft+map.clientWidth>=map.scrollWidth-1&&map.scrollTop+map.clientHeight>=map.scrollHeight-1;
    await new Promise(resolve=>setTimeout(resolve,250));
    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"W9",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-workflow-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoWorkflowWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body>
</html>
