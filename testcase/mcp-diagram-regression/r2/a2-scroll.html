<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-architecture><script type="application/json" data-architecture-source>{"version":1,"title":"CI/CD Delivery Path","description":"From commit to running container in the test cluster.","direction":"RIGHT","domains":[{"id":"src","label":"Source","color":"blue"},{"id":"build","label":"Build","color":"teal"},{"id":"run","label":"Runtime","color":"green"}],"nodes":[{"id":"git","label":"Git Repository","subtitle":"main branch","type":"external","domain":"src"},{"id":"ci","label":"Build Runner","subtitle":"test + bundle","domain":"build"},{"id":"reg","label":"Image Registry","subtitle":"tagged :sha","type":"cloud","domain":"build"},{"id":"k8s","label":"Test Cluster","subtitle":"rolling update","type":"cloud","domain":"run"}],"edges":[{"from":"git","to":"ci","label":"webhook"},{"from":"ci","to":"reg","label":"push image","kind":"data"},{"from":"reg","to":"k8s","label":"pull image","kind":"data"},{"from":"k8s","to":"ci","label":"health status","kind":"return"}],"details":[{"title":"Gate policy","domain":"build","items":["Unit tests must pass before the image is pushed.","Failed health checks stop the rollout."]}],"notes":["Manual approval gates are out of scope."]}</script><p role="status">正在布局架构图…</p></section><script>addEventListener('penecho-architecture-ready',()=>{
    const originalSettled=globalThis['__penechoArchitectureWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();
    const root=document.querySelector('[data-penecho-architecture]'),map=root.querySelector('.pa-map'),svg=map.querySelector('svg'),source=root.querySelector('[data-architecture-source]').textContent;

    const nodes=[...svg.querySelectorAll('[data-node-id]')],select=root.querySelector('.pa-view-controls select');
    let allNodesReachable=true;const failures=[];
    for(const node of nodes){select.value=node.dataset.nodeId;select.dispatchEvent(new Event('change'));const b=node.getBoundingClientRect(),m=map.getBoundingClientRect(),x=m.left+map.clientLeft,y=m.top+map.clientTop;const ok=b.left>=x-1&&b.top>=y-1&&b.right<=x+map.clientWidth+1&&b.bottom<=y+map.clientHeight+1;allNodesReachable&&=ok;if(!ok)failures.push(node.dataset.nodeId);}

    map.scrollLeft=map.scrollTop=0;map.scrollBy({left:500,top:500,behavior:'instant'});
    const scrollMoved=(at100.scrollWidth<=at100.width||map.scrollLeft>0)&&(at100.scrollHeight<=at100.height||map.scrollTop>0);
    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);
    map.scrollLeft=map.scrollWidth;map.scrollTop=map.scrollHeight;
    const reachedEnd=map.scrollLeft+map.clientWidth>=map.scrollWidth-1&&map.scrollTop+map.clientHeight>=map.scrollHeight-1;
    await new Promise(resolve=>setTimeout(resolve,250));
    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"A2",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-architecture-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoArchitectureWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body></html>
