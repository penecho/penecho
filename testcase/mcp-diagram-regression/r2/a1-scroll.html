<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="r2-report" style="box-sizing:border-box;height:200px;overflow:auto;margin:0;font:13px/1.4 Arial;padding:12px;background:#ecfdf5;color:#166534;white-space:pre-wrap">检查中…</pre><section data-penecho-architecture><script type="application/json" data-architecture-source>{"description":"一次页面请求经过的三个组件","details":[{"domain":"app","items":["客户端只与 API 通信，不直连数据库。","API 负责鉴权、分页与缓存。"],"title":"链路说明"}],"domains":[{"color":"blue","id":"ui","label":"客户端"},{"color":"orange","id":"app","label":"应用层"},{"color":"purple","id":"data","label":"数据层"}],"edges":[{"from":"client","label":"GET /posts","to":"api"},{"from":"api","kind":"data","label":"SELECT 查询","to":"db"},{"from":"db","kind":"return","label":"结果集","to":"api"}],"nodes":[{"domain":"ui","id":"client","label":"浏览器客户端","subtitle":"用户侧","type":"frontend"},{"domain":"app","id":"api","label":"API 服务","subtitle":"业务逻辑"},{"domain":"data","id":"db","label":"PostgreSQL","subtitle":"持久化存储","type":"database"}],"notes":["仅示意一次读请求，未画出写路径与缓存层。"],"title":"博客系统请求链路","version":1}</script><p role="status">正在布局架构图…</p></section><script>addEventListener('penecho-architecture-ready',()=>{
    const originalSettled=globalThis['__penechoArchitectureWhenSettled'];
    const inspection=(async()=>{
    await new Promise(resolve=>setTimeout(resolve,250));await originalSettled();

    let allNodesReachable=true;const failures=[];

    const wheel=new WheelEvent('wheel',{deltaY:120,bubbles:true,cancelable:true});map.dispatchEvent(wheel);

    const zoomRetained=root.querySelector('.pa-view-controls output')?.textContent==='100%';
    const report=document.getElementById('r2-report');
    report.textContent=JSON.stringify({test:"A1",nodes:nodes.length,noArrowButtons:!root.querySelector('[data-pan]'),overview,at100,containerHeightStable:overview.outerHeight===at100.outerHeight,zoomRetained,nativeScrollMoved:scrollMoved,reachedEnd,wheelDefaultNotPrevented:!wheel.defaultPrevented,allNodesReachable,failures,fullViewBox:svg.getAttribute('viewBox'),sourceUnchanged:source===root.querySelector('[data-architecture-source]').textContent});
    root.querySelector('[data-view="fit"]').click();
    })();
    globalThis['__penechoArchitectureWhenSettled']=async()=>{await originalSettled();await inspection;};
  },{once:true});</script></body></html>
